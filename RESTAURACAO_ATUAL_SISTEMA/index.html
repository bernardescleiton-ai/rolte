<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Roleta da Sorte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            -webkit-text-size-adjust: 100%;
            overscroll-behavior-y: none;
        }
        input, button, select, textarea {
            font-family: inherit;
            touch-action: manipulation;
        }
        input {
            font-size: 16px !important;
            -webkit-appearance: none;
        }
        .gold-text {
            background: linear-gradient(180deg, #FFFDF0 0%, #FDE047 50%, #CA8A04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.8));
        }
        .gold-btn {
            background: linear-gradient(180deg, #FEF08A 0%, #FACC15 50%, #B45309 100%);
            box-shadow: 0 8px 30px rgba(250, 204, 21, 0.7), inset 0 2px 4px rgba(255,255,255,0.9), inset 0 -2px 4px rgba(120,53,15,0.9);
        }
        .casino-rim {
            background: radial-gradient(circle, #FEF08A 0%, #EAB308 50%, #78350F 100%);
            box-shadow: 0 0 70px rgba(234, 179, 8, 0.8), inset 0 0 25px rgba(255,255,255,0.8);
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }
        .casino-bulb {
            animation: pulse-glow 1s infinite alternate;
        }
    </style>
</head>
<body class="bg-[#060913] text-white min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col relative z-10">
        <!-- Rendered dynamically by JS -->
    </div>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform transition-all duration-300 translate-y-24 opacity-0 pointer-events-none bg-slate-900 border border-yellow-500/50 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMsg">Mensagem</span>
    </div>

    <script>
        // --- Supabase Cloud Connection ---
        const SUPABASE_URL = "https://glcsnkebmjtuqeciihzu.supabase.co";
        const SUPABASE_KEY = "sb_publishable_hxcloNo4rrkNUvtJ4ogk7A_FGaGTSfT";

        let supabaseStatus = "connected"; // "connected", "syncing", "error"
        let supabaseErrorMessage = "";
        let isSaving = false;

        // In-memory draft for admin settings to prevent any reset while typing
        let settingsDraft = {};

        // --- Database & LocalStorage State Management ---
        const DB_KEY = "roleta_db_v1";

        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getInitialData() {
            return {
                campaigns: [
                    { id: 1, name: "Outubro Premiado", slug: "outubro", active: true }
                ],
                prizes: [
                    { id: 1, campaignId: 1, name: "R$5 de Desconto", description: "Desconto exclusivo de 5%", displayText: "Ganhou R$5", resultText: "R$5 DE DESCONTO", discount: "Ganhou R$5", weight: 80, quantity: 499, unlimitedQuantity: false, active: true },
                    { id: 2, campaignId: 1, name: "R$10 de Desconto", description: "Desconto especial de 10%", displayText: "Ganhou R$10", resultText: "R$10 DE DESCONTO", discount: "Ganhou R$10", weight: 60, quantity: 297, unlimitedQuantity: false, active: true },
                    { id: 3, campaignId: 1, name: "R$15 de Desconto", description: "Desconto exclusivo de 15%", displayText: "Ganhou R$15", resultText: "R$15 DE DESCONTO", discount: "Ganhou R$15", weight: 10, quantity: 150, unlimitedQuantity: false, active: true },
                    { id: 4, campaignId: 1, name: "R$20 de Desconto", description: "Super desconto de 20%", displayText: "Ganhou R$20", resultText: "R$20 DE DESCONTO", discount: "Ganhou R$20", weight: 1, quantity: 80, unlimitedQuantity: false, active: true },
                    { id: 5, campaignId: 1, name: "GIRO GRÁTIS", description: "Prêmio máximo da roleta!", displayText: "GIRO GRÁTIS", resultText: "VOCÊ GANHOU MAIS UM GIRO DA SORTE!", discount: "GIRO GRÁTIS", weight: 10, quantity: 10, unlimitedQuantity: false, active: true }
                ],
                codes: [
                    { id: 1, campaignId: 1, code: "RLT-7X92KP", status: "AVAILABLE", usedAt: null },
                    { id: 2, campaignId: 1, code: "RLT-4M8Q2A", status: "AVAILABLE", usedAt: null },
                    { id: 3, campaignId: 1, code: "RLT-9ZK31B", status: "AVAILABLE", usedAt: null },
                    { id: 4, campaignId: 1, code: "RLT-2P7X8M", status: "AVAILABLE", usedAt: null },
                    { id: 5, campaignId: 1, code: "RLT-TEST01", status: "AVAILABLE", usedAt: null },
                    { id: 6, campaignId: 1, code: "RLT-SORTE", status: "AVAILABLE", usedAt: null },
                    { id: 7, campaignId: 1, code: "RLT-VIP10", status: "AVAILABLE", usedAt: null },
                    { id: 8, campaignId: 1, code: "RLT-CLIENTE", status: "AVAILABLE", usedAt: null }
                ],
                spins: [],
                clients: [],
                settings: {
                    1: {
                        title: "ROLETA DA SORTE",
                        subtitle: "Gire a roleta e ganhe descontos e benefícios incríveis!",
                        code_placeholder: "Digite seu código (ex: RLT-7X92KP)",
                        liberate_button: "LIBERAR ROLETA",
                        valid_code_msg: "Código validado com sucesso!",
                        spin_button: "CLIQUE AQUI E GIRE A ROLETA",
                        spinning_msg: "Girando roleta...",
                        result_title: "🎉 PARABÉNS! 🎉",
                        result_prize_prefix: "VOCÊ GANHOU",
                        result_success_msg: "Seu prêmio foi registrado com sucesso no sistema.",
                        promo_message: "Olá {nome}! Seu plano vence em {vencimento}.\nVocê ganhou um giro exclusivo na nossa Roleta da Sorte!\nAcesse o link abaixo e use o seu código para liberar a roleta:\n{link}\nSeu código: {codigo}\nBoa sorte! 🎉",
                        bg_color: "#060913",
                        text_color: "#FFFFFF",
                        btn_color: "#FACC15",
                        btn_text_color: "#1E1B4B"
                    }
                }
            };
        }

        function loadDB() {
            const data = localStorage.getItem(DB_KEY);
            if (!data) {
                const initial = getInitialData();
                localStorage.setItem(DB_KEY, JSON.stringify(initial));
                return initial;
            }
            try {
                const parsed = JSON.parse(data);
                if (!parsed.campaigns || !parsed.prizes) {
                    const initial = getInitialData();
                    localStorage.setItem(DB_KEY, JSON.stringify(initial));
                    return initial;
                }
                if (!parsed.clients) parsed.clients = [];
                // Auto-correct any inverted phone / vencimento in saved records
                parsed.clients.forEach(c => {
                    if (c.whatsapp && c.vencimento) {
                        const isDatePhone = /\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4}/.test(c.whatsapp);
                        const isDateVenc = /\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4}/.test(c.vencimento);
                        if (isDatePhone && !isDateVenc) {
                            const tmp = c.whatsapp;
                            c.whatsapp = c.vencimento;
                            c.vencimento = tmp;
                            const digits = c.whatsapp.replace(/\D/g, '');
                            if (digits.length === 11) {
                                c.whatsapp = `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
                            } else if (digits.length === 10) {
                                c.whatsapp = `(${digits.slice(0, 2)}) ${digits.slice(2, 6)}-${digits.slice(6)}`;
                            }
                            let phoneForWa = digits;
                            if (!phoneForWa.startsWith('55') && (phoneForWa.length === 10 || phoneForWa.length === 11)) {
                                phoneForWa = '55' + phoneForWa;
                            }
                            c.cleanPhone = phoneForWa;
                        }
                    }
                });
                return parsed;
            } catch (e) {
                const initial = getInitialData();
                localStorage.setItem(DB_KEY, JSON.stringify(initial));
                return initial;
            }
        }

        function getActiveSettings(db, campaignId = 1) {
            const saved = (db.settings || {})[campaignId] || (db.settings || {})[1] || (db.settings || {})["1"] || {};
            return {
                title: settingsDraft.title !== undefined ? settingsDraft.title : (saved.title !== undefined ? saved.title : "ROLETA DA SORTE"),
                subtitle: settingsDraft.subtitle !== undefined ? settingsDraft.subtitle : (saved.subtitle !== undefined ? saved.subtitle : "Gire a roleta e ganhe descontos e benefícios incríveis!"),
                spin_button: settingsDraft.spin_button !== undefined ? settingsDraft.spin_button : (saved.spin_button !== undefined ? saved.spin_button : "CLIQUE AQUI E GIRE A ROLETA"),
                liberate_button: settingsDraft.liberate_button !== undefined ? settingsDraft.liberate_button : (saved.liberate_button !== undefined ? saved.liberate_button : "LIBERAR ROLETA"),
                bg_color: settingsDraft.bg_color !== undefined ? settingsDraft.bg_color : (saved.bg_color || "#060913"),
                bg_image: settingsDraft.bg_image !== undefined ? settingsDraft.bg_image : (saved.bg_image || ""),
                btn_color: settingsDraft.btn_color !== undefined ? settingsDraft.btn_color : (saved.btn_color || "#FACC15"),
                text_color: saved.text_color || "#FFFFFF",
                btn_text_color: saved.btn_text_color || "#1E1B4B",
                code_placeholder: saved.code_placeholder || "Digite seu código (ex: RLT-7X92KP)",
                valid_code_msg: saved.valid_code_msg || "Código validado com sucesso!",
                spinning_msg: saved.spinning_msg || "Girando roleta...",
                result_title: saved.result_title || "🎉 PARABÉNS! 🎉",
                result_prize_prefix: saved.result_prize_prefix || "VOCÊ GANHOU",
                result_success_msg: saved.result_success_msg || "Seu prêmio foi registrado com sucesso no sistema.",
                promo_message: (settingsDraft.campaignId == campaignId && settingsDraft.promo_message !== undefined) ? settingsDraft.promo_message : (saved.promo_message || "Olá {nome}! Seu plano vence em {vencimento}.\nVocê ganhou um giro exclusivo na nossa Roleta da Sorte!\nAcesse o link abaixo e use o seu código para liberar a roleta:\n{link}\nSeu código: {codigo}\nBoa sorte! 🎉")
            };
        }

        async function fetchFromSupabase(silent = false) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/user_favorites?song_id=eq.roleta_config`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }

                const list = await res.json();
                if (list && list.length > 0 && list[0].video_data) {
                    const cloudData = list[0].video_data;
                    if (cloudData.campaigns && Array.isArray(cloudData.campaigns)) {
                        supabaseStatus = "connected";
                        supabaseErrorMessage = "";
                        updateSupabaseUI();

                        const isCurrentAdmin = window.location.hash.includes("admin");

                        // If user is inside admin panel, NEVER silently re-render and wipe their editing form!
                        if (isCurrentAdmin) {
                            const local = loadDB();
                            // Keep cloud data in sync
                            if (cloudData.campaigns && adminTab !== 'campaigns') local.campaigns = cloudData.campaigns;
                            if (cloudData.spins) local.spins = cloudData.spins;
                            if (cloudData.codes) local.codes = cloudData.codes;
                            if (cloudData.clients && adminTab !== 'bulk_clients') local.clients = cloudData.clients;
                            if (cloudData.prizes && adminTab !== 'prizes') local.prizes = cloudData.prizes;
                            
                            // Only adopt cloud settings if user has not typed any local draft
                            if (Object.keys(settingsDraft).length === 0 && cloudData.settings) {
                                local.settings = cloudData.settings;
                            }
                            localStorage.setItem(DB_KEY, JSON.stringify(local));

                            if (!silent) {
                                showToast("Sincronizado com Supabase com sucesso!", "success");
                                router();
                            }
                            return;
                        }

                        // For public roleta: only update when user is NOT typing a code and not spinning
                        const localRaw = localStorage.getItem(DB_KEY);
                        const cloudRaw = JSON.stringify(cloudData);

                        if (localRaw !== cloudRaw) {
                            localStorage.setItem(DB_KEY, cloudRaw);
                            
                            const codeInput = document.getElementById("codeInput");
                            const isTypingCode = codeInput && (document.activeElement === codeInput || codeInput.value.length > 0);

                            if (!isTypingCode && !isSpinning && !currentCodeObj) {
                                router();
                            }
                        }
                        if (!silent) showToast("Sincronizado com Supabase com sucesso!", "success");
                        return;
                    }
                }

                // If no row exists yet, seed it with current local db
                const current = loadDB();
                await saveToSupabase(current, false);
                supabaseStatus = "connected";
                updateSupabaseUI();
            } catch (e) {
                console.warn("Supabase fetch warning:", e);
                supabaseStatus = "error";
                supabaseErrorMessage = e.message || "Erro de conexão";
                updateSupabaseUI();
                if (!silent) showToast("Erro ao conectar com Supabase: " + supabaseErrorMessage, "error");
            }
        }

        async function saveToSupabase(db, notify = true) {
            isSaving = true;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/user_favorites?song_id=eq.roleta_config`, {
                    method: "PATCH",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify({
                        video_data: db,
                        updated_at: new Date().toISOString()
                    })
                });

                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }

                supabaseStatus = "connected";
                supabaseErrorMessage = "";
                updateSupabaseUI();
                if (notify) showToast("Salvo e sincronizado no Supabase em tempo real!", "success");
            } catch (e) {
                console.error("Supabase save error:", e);
                supabaseStatus = "error";
                supabaseErrorMessage = e.message || "Erro ao salvar no Supabase";
                updateSupabaseUI();
                if (notify) showToast("Salvo localmente! Verifique a conexão com o Supabase.", "warning");
            } finally {
                isSaving = false;
            }
        }

        function saveDB(db, notify = true) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            saveToSupabase(db, notify);
        }

        // Auto-fetch on initial page load
        fetchFromSupabase(true);

        // Periodic background sync every 25 seconds ONLY when on public roleta and idle
        setInterval(() => {
            const isCurrentAdmin = window.location.hash.includes("admin");
            const codeInput = document.getElementById("codeInput");
            const isTypingCode = codeInput && (document.activeElement === codeInput || codeInput.value.length > 0);

            if (!isCurrentAdmin && !isSpinning && !isSaving && !isTypingCode && !currentCodeObj) {
                fetchFromSupabase(true);
            }
        }, 25000);

        function showToast(msg, type = "success") {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMsg");
            const toastIcon = document.getElementById("toastIcon");
            if (!toast) return;

            toastMsg.innerText = msg;
            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            } else if (type === "warning") {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400 text-lg";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-red-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-info-circle text-blue-400 text-lg";
            }

            toast.classList.remove("translate-y-24", "opacity-0", "pointer-events-none");
            toast.classList.add("translate-y-0", "opacity-100");

            setTimeout(() => {
                toast.classList.add("translate-y-24", "opacity-0", "pointer-events-none");
                toast.classList.remove("translate-y-0", "opacity-100");
            }, 3500);
        }

        // --- Router & App State ---
        let currentCodeObj = null;
        let isSpinning = false;
        let lastWonPrize = null;
        let currentRotation = 0;
        let selectedSpinIds = new Set();
        let selectedCodeIds = new Set();
        let selectedAdminCampaignId = null;
        let resultsFilterMode = 'current'; // 'current' or 'all'

        function getActiveAdminCampaign(db) {
            const camps = db.campaigns || [];
            if (camps.length === 0) {
                const defaultCamp = { id: 1, name: "Campanha Principal", slug: "principal", active: true };
                db.campaigns = [defaultCamp];
                saveDB(db, false);
                return defaultCamp;
            }
            if (selectedAdminCampaignId) {
                const found = camps.find(c => String(c.id) === String(selectedAdminCampaignId));
                if (found) return found;
            }
            const savedId = localStorage.getItem("roleta_selected_campaign_id");
            if (savedId) {
                const found = camps.find(c => String(c.id) === String(savedId));
                if (found) {
                    selectedAdminCampaignId = found.id;
                    return found;
                }
            }
            selectedAdminCampaignId = camps[0].id;
            return camps[0];
        }

        function setActiveAdminCampaign(id) {
            selectedAdminCampaignId = id;
            localStorage.setItem("roleta_selected_campaign_id", String(id));
            settingsDraft = {};
            router();
        }

        function setResultsFilter(mode) {
            resultsFilterMode = mode;
            router();
        }

        function selectCampaignAndTab(id, tab = 'prizes') {
            selectedAdminCampaignId = id;
            localStorage.setItem("roleta_selected_campaign_id", String(id));
            settingsDraft = {};
            adminTab = tab;
            router();
        }

        function router() {
            try {
                const hash = window.location.hash;
                const app = document.getElementById("app");
                const db = loadDB();

                if (hash.includes("admin")) {
                    if (isAdminAuthenticated()) {
                        renderAdmin(app, db);
                    } else {
                        renderAdminLogin(app, db);
                    }
                } else {
                    let slug = "outubro";
                    if (hash.startsWith("#roleta/")) {
                        slug = hash.replace("#roleta/", "");
                    }
                    const campaign = (db.campaigns || []).find(c => c.slug === slug) || (db.campaigns || [])[0];
                    renderPublicRoleta(app, db, campaign);
                }
            } catch (e) {
                console.error("Router error:", e);
                document.getElementById("app").innerHTML = `<div class="p-8 text-red-500 font-bold">Erro ao carregar tela: ${e.message}</div>`;
            }
        }

        window.addEventListener("hashchange", router);
        window.addEventListener("load", router);

        // --- Public Roleta Screen (Zero admin buttons, iOS Safe) ---
        function renderPublicRoleta(container, db, campaign) {
            if (!campaign || campaign.active === false) {
                container.innerHTML = `
                    <div class="flex-1 flex items-center justify-center p-6 text-center">
                        <div class="bg-slate-900 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-800">
                            <h1 class="text-2xl font-bold text-red-500 mb-2">Campanha Indisponível</h1>
                            <p class="text-slate-400">Esta campanha de prêmios está encerrada ou não existe.</p>
                        </div>
                    </div>
                `;
                return;
            }

            const settings = getActiveSettings(db, campaign.id);
            
            // Filter prizes strictly for this campaign
            let prizes = (db.prizes || []).filter(p => String(p.campaignId) === String(campaign.id) && p.active !== false && (p.unlimitedQuantity || p.quantity === undefined || p.quantity > 0));

            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-4 relative transition-colors duration-300 min-h-screen overflow-hidden" style="background-color: ${settings.bg_color || '#060913'}; color: ${settings.text_color || '#FFFFFF'};">
                    ${settings.bg_image ? `
                        <div class="absolute inset-0 bg-cover bg-center bg-no-repeat pointer-events-none transition-all duration-500" style="background-image: url('${settings.bg_image}');"></div>
                        <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-[1px] pointer-events-none"></div>
                    ` : ''}
                    <div class="max-w-md w-full text-center px-4 py-6 flex flex-col items-center relative z-10">
                        
                        <!-- Header Title configured by user in admin panel -->
                        <div class="mb-4 text-center">
                            <h1 class="text-3xl sm:text-4xl md:text-5xl font-black tracking-wider gold-text uppercase flex items-center justify-center gap-2 drop-shadow-lg">
                                <span>${escapeHtml(settings.title || 'ROLETA DA SORTE')}</span>
                                <i class="fa-solid fa-clover text-yellow-400 text-2xl sm:text-3xl"></i>
                            </h1>
                            <p class="text-xs sm:text-sm font-semibold text-yellow-100/90 mt-2 max-w-xs mx-auto">
                                ${escapeHtml(settings.subtitle || 'Gire a roleta e ganhe descontos e benefícios incríveis!')}
                            </p>
                        </div>

                        <!-- Wheel Container with Casino Glowing Rim & Bulbs -->
                        <div class="relative w-80 h-80 sm:w-88 sm:h-88 mx-auto mb-6 flex items-center justify-center select-none pointer-events-none">
                            <!-- Outer Casino Rim with Bulbs -->
                            <div class="absolute inset-0 rounded-full casino-rim p-5 flex items-center justify-center shadow-[0_0_80px_rgba(234,179,8,0.8)]">
                                <!-- Glowing Light Bulbs Around Rim -->
                                <div class="absolute inset-2 rounded-full border-2 border-dashed border-yellow-100/60 pointer-events-none"></div>
                                <div class="absolute top-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]"></div>
                                <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]" style="animation-delay: 0.3s;"></div>
                                <div class="absolute left-1 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]" style="animation-delay: 0.6s;"></div>
                                <div class="absolute right-1 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]" style="animation-delay: 0.9s;"></div>
                                <div class="absolute top-6 left-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.2s;"></div>
                                <div class="absolute top-6 right-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.5s;"></div>
                                <div class="absolute bottom-6 left-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.7s;"></div>
                                <div class="absolute bottom-6 right-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.4s;"></div>

                                <!-- Inner Wheel Background -->
                                <div class="w-full h-full rounded-full bg-slate-950 relative flex items-center justify-center overflow-hidden border-2 border-yellow-400 shadow-inner">

        function drawWheel(prizes, rotationAngle) {
            const canvas = document.getElementById("wheelCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const width = canvas.width;
            const height = canvas.height;
            const center = width / 2;
            const radius = center - 6;

            ctx.clearRect(0, 0, width, height);

            if (!prizes || prizes.length === 0) return;

            const sliceAngle = (2 * Math.PI) / prizes.length;
            const colors = ["#7C3AED", "#2563EB", "#059669", "#DB2777", "#EA580C", "#D97706", "#4F46E5"];

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(rotationAngle * Math.PI / 180);
            ctx.translate(-center, -center);

            prizes.forEach((prize, i) => {
                const startAngle = i * sliceAngle;
                const endAngle = (i + 1) * sliceAngle;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = "#FDE047";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#FFFFFF";
                ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
                ctx.shadowBlur = 8;
                ctx.font = "bold 14px -apple-system, BlinkMacSystemFont, sans-serif";
                ctx.fillText(prize.displayText || prize.discount || prize.name, radius - 20, 5);
                ctx.restore();
            });

            ctx.restore();
        }

        function validateCode(campaignId) {
            const inputElem = document.getElementById("codeInput");
            const input = inputElem ? inputElem.value.trim().toUpperCase() : "";
            const db = loadDB();
            const errDiv = document.getElementById("codeError");

            if (!input) {
                if (errDiv) errDiv.innerText = "Por favor, digite um código.";
                return;
            }

            const codeObj = (db.codes || []).find(c => String(c.campaignId) === String(campaignId) && c.code === input);
            if (!codeObj) {
                if (errDiv) errDiv.innerText = "Código inválido.";
                return;
            }

            if (codeObj.status === "USED") {
                if (errDiv) errDiv.innerText = "Este código já foi utilizado.";
                return;
            }

            if (codeObj.status === "INACTIVE") {
                if (errDiv) errDiv.innerText = "Este código está inativo.";
                return;
            }

            // Dismiss keyboard cleanly on iOS Safari to prevent layout jumps
            if (inputElem && typeof inputElem.blur === 'function') {
                inputElem.blur();
            }
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
                document.activeElement.blur();
            }

            currentCodeObj = codeObj;
            if (errDiv) errDiv.innerText = "";
            
            // In-place update to prevent destroying the canvas/DOM on iOS
            updateInteractionArea(campaignId);
        }

        function spinWheel(campaignId) {
            if (isSpinning || !currentCodeObj) return;
            isSpinning = true;

            const db = loadDB();
            let prizes = (db.prizes || []).filter(p => String(p.campaignId) === String(campaignId) && p.active !== false && (p.unlimitedQuantity || p.quantity === undefined || p.quantity > 0));

            if (prizes.length === 0) {
                alert("Nenhum prêmio disponível no momento.");
                isSpinning = false;
                return;
            }

            const totalWeight = prizes.reduce((sum, p) => sum + (p.weight || 10), 0);
            let randomWeight = Math.floor(Math.random() * totalWeight);
            let selectedPrize = prizes[0];

            for (let p of prizes) {
                const w = p.weight || 10;
                if (randomWeight < w) {
                    selectedPrize = p;
                    break;
                }
                randomWeight -= w;
            }

            // Mark code as used
            const codeIndex = db.codes.findIndex(c => c.id === currentCodeObj.id);
            if (codeIndex !== -1) {
                db.codes[codeIndex].status = "USED";
                db.codes[codeIndex].usedAt = Date.now();
            }

            // Decrease quantity
            if (!selectedPrize.unlimitedQuantity && selectedPrize.quantity !== undefined && selectedPrize.quantity > 0) {
                const prizeIndex = db.prizes.findIndex(p => p.id === selectedPrize.id);
                if (prizeIndex !== -1) {
                    db.prizes[prizeIndex].quantity -= 1;
                    if (db.prizes[prizeIndex].quantity === 0) {
                        db.prizes[prizeIndex].active = false;
                    }
                }
            }

            // Record spin & match client
            const codeStr = String(currentCodeObj.code || '').trim().toUpperCase();
            const linkedClientIndex = (db.clients || []).findIndex(cl => {
                if (!cl.codigo) return false;
                const matchesCamp = String(cl.campaignId) === String(campaignId) || !cl.campaignId;
                return matchesCamp && String(cl.codigo).trim().toUpperCase() === codeStr;
            });
            const linkedClient = linkedClientIndex !== -1 ? db.clients[linkedClientIndex] : null;

            if (linkedClient) {
                db.clients[linkedClientIndex].hasSpun = true;
                db.clients[linkedClientIndex].spunAt = Date.now();
                db.clients[linkedClientIndex].prizeWon = selectedPrize.name;
                db.clients[linkedClientIndex].prizeDiscount = selectedPrize.discount || selectedPrize.displayText;
            }

            const newSpin = {
                id: Date.now(),
                campaignId: campaignId,
                accessCodeId: currentCodeObj.code,
                prizeId: selectedPrize.id,
                clientId: linkedClient ? linkedClient.id : null,
                clientName: linkedClient ? (linkedClient.nome || "") : "",
                clientPhone: linkedClient ? (linkedClient.whatsapp || "") : "",
                clientVencimento: linkedClient ? (linkedClient.vencimento || "") : "",
                observation: linkedClient ? `WhatsApp: ${linkedClient.whatsapp || ''}${linkedClient.vencimento ? ' | Vencimento: ' + linkedClient.vencimento : ''}` : "",
                prizeNameSnapshot: selectedPrize.name,
                discountSnapshot: selectedPrize.discount || selectedPrize.displayText,
                createdAt: Date.now()
            };
            if (!db.spins) db.spins = [];
            db.spins.unshift(newSpin);
            saveDB(db, false);

            // Calculate precise stop angle
            const prizeIndex = prizes.findIndex(p => p.id === selectedPrize.id);
            const sliceAngleDeg = 360 / prizes.length;
            const targetSliceCenterAngle = prizeIndex * sliceAngleDeg + (sliceAngleDeg / 2);
            const desiredMod = (270 - targetSliceCenterAngle + 360) % 360;
            const currentMod = currentRotation % 360;
            let diff = desiredMod - currentMod;
            if (diff < 0) diff += 360;

            const targetAngle = currentRotation + (360 * 6) + diff;
            currentRotation = targetAngle;

            const canvas = document.getElementById("wheelCanvas");
            if (canvas) {
                canvas.style.transform = `rotate(${targetAngle}deg)`;
                canvas.style.webkitTransform = `rotate(${targetAngle}deg)`;
            }

            setTimeout(() => {
                isSpinning = false;
                lastWonPrize = selectedPrize;
                updateInteractionArea(campaignId);
            }, 5000);
        }

        async function handleAdminLogin(event) {
            if (event) event.preventDefault();
            const emailInput = document.getElementById("adminLoginEmail");
            const passInput = document.getElementById("adminLoginPassword");
            const errorBox = document.getElementById("adminLoginError");
            const errorText = document.getElementById("adminLoginErrorText");
            const btn = document.getElementById("btnAdminLogin");

            if (!emailInput || !passInput) return;
            const email = (emailInput.value || '').trim();
            const password = passInput.value || '';

            if (!email || !password) {
                if (errorBox && errorText) {
                    errorText.textContent = "Preencha o e-mail e a senha.";
                    errorBox.classList.remove("hidden");
                }
                return;
            }

            if (errorBox) errorBox.classList.add("hidden");
            if (btn) {
                btn.disabled = true;
                btn.classList.add("opacity-75", "cursor-wait");
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Verificando...</span>`;
            }

            try {
                let authSuccess = false;
                let token = "";

                // 1. Supabase Cloud Auth API check
                try {
                    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                        method: "POST",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email: email, password: password })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        token = data.access_token || ("supabase_auth_" + Date.now());
                        authSuccess = true;
                    }
                } catch (netErr) {
                    console.warn("Supabase auth API network error:", netErr);
                }

                // 2. Safety fallback for initial access or offline
                if (!authSuccess) {
                    const lower = email.toLowerCase();
                    const localDB = loadDB();
                    const validEmails = [
                        "admin@admin.com",
                        "bernardes.cleiton@gmail.com",
                        (localDB.adminEmail || "").toLowerCase().trim()
                    ].filter(Boolean);

                    if (validEmails.includes(lower) && (password === "admin" || password === "admin123" || password === "123456" || password === (localDB.adminPassword || ""))) {
                        token = "session_" + Date.now();
                        authSuccess = true;
                    }
                }

                if (authSuccess) {
                    localStorage.setItem("roleta_admin_auth_token", token);
                    localStorage.setItem("roleta_admin_email", email);
                    showToast("Login efetuado com sucesso!", "success");
                    router();
                    return;
                } else {
                    if (errorBox && errorText) {
                        errorText.textContent = "E-mail ou senha incorretos no Supabase.";
                        errorBox.classList.remove("hidden");
                    }
                }
            } catch (err) {
                console.error("Login exception:", err);
                if (errorBox && errorText) {
                    errorText.textContent = "Erro de conexão ao autenticar.";
                    errorBox.classList.remove("hidden");
                }
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.classList.remove("opacity-75", "cursor-wait");
                    btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>Entrar</span>`;
                }
            }
        }

                            <span class="text-slate-400 font-bold uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-bullhorn text-yellow-400"></i> Campanha em Edição:
                            </span>
                            <select onchange="setActiveAdminCampaign(this.value)" class="bg-slate-900 border border-slate-700 text-yellow-400 font-bold px-3 py-1.5 rounded-xl text-xs focus:ring-1 focus:ring-yellow-400 cursor-pointer">
                                ${camps.map(c => `
                                    <option value="${c.id}" ${String(c.id) === String(activeCamp.id) ? 'selected' : ''}>
                                        ${escapeHtml(c.name)} (${c.active !== false ? 'Ativa' : 'Inativa'})
                                    </option>
                                `).join('')}
                            </select>
                            <button onclick="openNewCampaignModal()" class="bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-300 border border-yellow-500/40 px-2.5 py-1 rounded-lg font-bold text-[11px] flex items-center gap-1 transition" title="Criar nova campanha com dados separados">
                                <i class="fa-solid fa-plus"></i> Nova
                            </button>
                        </div>
                        <div class="flex items-center gap-2 font-mono text-[11px]">
                            <span class="text-slate-500">Link Público:</span>
                            <a href="#roleta/${activeCamp.slug}" target="_blank" class="text-yellow-400 underline font-bold hover:text-yellow-300">/#roleta/${activeCamp.slug}</a>
                            <button onclick="copyCampaignLink('${activeCamp.slug}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-md transition" title="Copiar Link">
                                <i class="fa-solid fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <div class="bg-slate-900 border-b border-slate-800 flex overflow-x-auto px-4 gap-2">
                        <button onclick="setAdminTab('prizes')" class="px-4 py-3 font-semibold text-sm border-b-2 transition ${adminTab === 'prizes' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400 hover:text-white'} whitespace-nowrap">Prêmios & Frases</button>
                        <button onclick="setAdminTab('codes')" class="px-4 py-3 font-semibold text-sm border-b-2 transition ${adminTab === 'codes' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400 hover:text-white'} whitespace-nowrap">Códigos</button>
                        <button onclick="setAdminTab('results')" class="px-4 py-3 font-semibold text-sm border-b-2 transition ${adminTab === 'results' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400 hover:text-white'} whitespace-nowrap">Resultados dos Giros</button>
                        <button onclick="setAdminTab('bulk_clients')" class="px-4 py-3 font-semibold text-sm border-b-2 transition ${adminTab === 'bulk_clients' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400 hover:text-white'} flex items-center gap-1.5 whitespace-nowrap">
                            <i class="fa-brands fa-whatsapp text-emerald-400"></i>
                            <span>Clientes & WhatsApp</span>
                            <span class="px-1.5 py-0.2 rounded-full text-[10px] font-bold ${adminTab === 'bulk_clients' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-800 text-slate-300'}">${((db.clients || []).filter(c => String(c.campaignId) === String(activeCamp.id))).length}</span>
                        </button>
                        <button onclick="setAdminTab('settings')" class="px-4 py-3 font-semibold text-sm border-b-2 transition ${adminTab === 'settings' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400 hover:text-white'} whitespace-nowrap">Configurações</button>
                        <button onclick="setAdminTab('campaigns')" class="px-4 py-3 font-semibold text-sm border-b-2 transition ${adminTab === 'campaigns' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400 hover:text-white'} flex items-center gap-1.5 whitespace-nowrap">
                            <span>Campanhas</span>
                            <span class="px-1.5 py-0.2 rounded-full text-[10px] font-bold ${adminTab === 'campaigns' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-800 text-slate-300'}">${camps.length}</span>
                        </button>
                    </div>

                    <main class="flex-1 p-6 overflow-y-auto max-w-5xl w-full mx-auto" id="adminContent">
                        ${renderAdminTabContent(db)}
                    </main>
                </div>
            `;
        }

        function setAdminTab(tab) {
            adminTab = tab;
            router();
        }

        function handleSettingsChange(field, val, campId) {
            settingsDraft[field] = val;
            const db = loadDB();
            if (!db.settings) db.settings = {};
            if (!db.settings[campId]) db.settings[campId] = {};
            db.settings[campId][field] = val;
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function renderAdminTabContent(db) {
            try {
                if (adminTab === 'prizes') {
                    const activeCamp = getActiveAdminCampaign(db);
                    const prizes = (db.prizes || []).filter(p => String(p.campaignId) === String(activeCamp.id));
                    const totalWeight = prizes.filter(p => p.active !== false).reduce((sum, p) => sum + (p.weight || 10), 0);

                    return `
                        <div class="space-y-6">
                            <div class="flex justify-between items-center flex-wrap gap-3">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h2 class="text-2xl font-bold">Prêmios da Roleta</h2>
                                        <span class="bg-yellow-500/20 text-yellow-300 border border-yellow-500/40 text-xs px-2.5 py-0.5 rounded-full font-bold">Campanha: ${escapeHtml(activeCamp.name)}</span>
                                    </div>
                                    <p class="text-xs text-slate-400">Valores, probabilidades e estoque exclusivos desta campanha</p>
                                </div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <button onclick="openPrizeModal(null, ${activeCamp.id})" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-4 py-2.5 rounded-xl font-black text-sm flex items-center gap-2 shadow-lg" style="touch-action: manipulation;">
                                        <i class="fa-solid fa-plus"></i> Adicionar Prêmio / Frase
                                    </button>
                                </div>
                            </div>
                            <div class="grid gap-4">
                                ${prizes.length === 0 ? `
                                    <div class="bg-slate-800/60 border border-slate-700/60 p-8 rounded-2xl text-center text-slate-400 space-y-3">
                                        <i class="fa-solid fa-gift text-3xl text-slate-600"></i>
                                        <p class="font-medium text-white">Nenhum prêmio cadastrado nesta campanha ainda.</p>
                                        <div class="flex items-center justify-center gap-3 pt-2">
                                            <button onclick="openPrizeModal(null, ${activeCamp.id})" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-4 py-2 rounded-xl font-bold text-xs">
                                                + Adicionar Prêmio
                                            </button>
                                            <button onclick="seedDefaultPrizesForCampaign(${activeCamp.id})" class="bg-slate-700 hover:bg-slate-600 text-yellow-400 px-4 py-2 rounded-xl font-bold text-xs">
                                                Inserir Prêmios Padrão
                                            </button>
                                        </div>
                                    </div>
                                ` : prizes.map(p => {
                                    const w = p.weight || 10;
                                    const prob = totalWeight > 0 && p.active !== false ? ((w / totalWeight) * 100).toFixed(1) : 0;
                                    return `
                                        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-wrap justify-between items-center gap-4 hover:border-yellow-500/50 transition">
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-3">
                                                    <h3 class="font-black text-lg text-white">${escapeHtml(p.name)}</h3>
                                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${p.active !== false ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-400'}">
                                                        ${p.active !== false ? 'Ativo na Roleta' : 'Inativo'}
                                                    </span>
                                                </div>
                                                <p class="text-sm text-slate-300">
                                                    Texto na Fatia: <span class="font-bold text-yellow-400 px-2 py-0.5 bg-slate-900 rounded-md">"${escapeHtml(p.displayText || p.name)}"</span>
                                                    | Probabilidade: <span class="text-yellow-400 font-bold">${prob}%</span> (Peso ${w})
                                                </p>
                                                <p class="text-xs text-slate-400">Estoque: ${p.unlimitedQuantity ? 'Ilimitado' : (p.quantity || 0) + ' restantes'}</p>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <button onclick="openPrizeModal(${p.id}, ${p.campaignId || activeCamp.id})" class="bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5" title="Editar Prêmio" style="touch-action: manipulation;">
                                                    <i class="fa-solid fa-pen"></i> Editar
                                                </button>
                                                <button onclick="togglePrize(${p.id})" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-xl text-xs font-bold transition" style="touch-action: manipulation;">
                                                    ${p.active !== false ? 'Desativar' : 'Ativar'}
                                                </button>
                                                <button onclick="deletePrize(${p.id})" class="bg-red-600/30 hover:bg-red-600/50 text-red-300 p-2.5 rounded-xl transition" title="Excluir" style="touch-action: manipulation;">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                } else if (adminTab === 'codes') {
                    const activeCamp = getActiveAdminCampaign(db);
                    const codes = (db.codes || []).filter(c => String(c.campaignId) === String(activeCamp.id));
                    const usedCodes = codes.filter(c => c.status === 'USED');
                    const availableCodes = codes.filter(c => c.status === 'AVAILABLE');
                    const selectedUsedCount = usedCodes.filter(c => selectedCodeIds.has(c.id) || selectedCodeIds.has(String(c.id)) || selectedCodeIds.has(Number(c.id))).length;
                    const allUsedSelected = usedCodes.length > 0 && selectedUsedCount === usedCodes.length;

                    return `
                        <div class="space-y-6">
                            <div class="flex justify-between items-center flex-wrap gap-3">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h2 class="text-2xl font-bold">Códigos de Liberação</h2>
                                        <span class="bg-yellow-500/20 text-yellow-300 border border-yellow-500/40 text-xs px-2.5 py-0.5 rounded-full font-bold">Campanha: ${escapeHtml(activeCamp.name)}</span>
                                    </div>
                                    <p class="text-xs text-slate-400">
                                        Total: <span class="font-bold text-white">${codes.length}</span> | 
                                        Disponíveis: <span class="font-bold text-emerald-400">${availableCodes.length}</span> | 
                                        Já Usados: <span class="font-bold text-amber-400">${usedCodes.length}</span>
                                    </p>
                                </div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    ${usedCodes.length > 0 ? `
                                        <button onclick="deleteSelectedUsedCodes()" id="btnDeleteSelectedCodes" class="${selectedUsedCount > 0 ? 'bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-900/50 cursor-pointer' : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'} px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition" style="touch-action: manipulation;" ${selectedUsedCount > 0 ? '' : 'disabled'}>
                                            <i class="fa-solid fa-trash"></i> Excluir Usados Selecionados (<span id="selectedUsedCountBadge">${selectedUsedCount}</span>)
                                        </button>
                                        <button onclick="deleteAllUsedCodes(${activeCamp.id})" class="bg-red-950/40 hover:bg-red-900/50 text-red-300 border border-red-700/40 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition" style="touch-action: manipulation;" title="Excluir todos os códigos já usados desta campanha">
                                            <i class="fa-solid fa-broom"></i> Excluir Todos Usados
                                        </button>
                                    ` : ''}
                                    <button onclick="generateCodes(${activeCamp.id}, 10)" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow" style="touch-action: manipulation;">
                                        <i class="fa-solid fa-plus"></i> Gerar +10 Códigos
                                    </button>
                                    <button onclick="exportCodesCSV()" class="bg-slate-700 hover:bg-slate-600 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition" style="touch-action: manipulation;">
                                        <i class="fa-solid fa-download"></i> CSV
                                    </button>
                                </div>
                            </div>

                            ${usedCodes.length > 0 ? `
                                <div class="bg-slate-800/80 border border-slate-700 p-3.5 rounded-2xl flex items-center justify-between gap-3 text-xs flex-wrap">
                                    <label class="flex items-center gap-2.5 cursor-pointer font-bold select-none text-slate-200">
                                        <input type="checkbox" id="selectAllUsedCodesCheckbox" onchange="toggleSelectAllUsedCodes(this.checked)" class="w-4 h-4 rounded text-yellow-500 bg-slate-900 border-slate-600 focus:ring-yellow-400" ${allUsedSelected ? 'checked' : ''}>
                                        <span>Selecionar Todos os Códigos Já Usados (${usedCodes.length})</span>
                                    </label>
                                    <span class="text-slate-400 font-medium" id="selectedUsedInfoText">${selectedUsedCount} selecionado(s)</span>
                                </div>
                            ` : ''}

                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                ${codes.length === 0 ? `
                                    <div class="col-span-full bg-slate-800/60 border border-slate-700/60 p-8 rounded-2xl text-center text-slate-400 space-y-2">
                                        <i class="fa-solid fa-ticket text-3xl text-slate-600"></i>
                                        <p class="font-medium">Nenhum código cadastrado nesta campanha ainda.</p>
                                        <button onclick="generateCodes(${activeCamp.id}, 10)" class="mt-2 bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-4 py-2 rounded-xl font-bold text-xs">
                                            Gerar Primeiros 10 Códigos
                                        </button>
                                    </div>
                                ` : codes.map(c => {
                                    const isUsed = c.status === 'USED';
                                    const isChecked = selectedCodeIds.has(c.id) || selectedCodeIds.has(String(c.id)) || selectedCodeIds.has(Number(c.id));
                                    return `
                                        <div id="codeCard_${c.id}" class="bg-slate-800 p-3.5 rounded-xl border ${isChecked ? 'border-red-500/80 bg-red-950/20 shadow-md shadow-red-500/10' : (isUsed ? 'border-slate-700/70 bg-slate-800/60' : 'border-slate-700')} flex justify-between items-center transition">
                                            <div class="flex items-center gap-2.5">
                                                ${isUsed ? `
                                                    <input type="checkbox" value="${c.id}" onchange="toggleCodeSelection(${c.id}, this.checked)" class="used-code-checkbox w-4 h-4 rounded text-red-500 bg-slate-900 border-slate-600 focus:ring-red-400 cursor-pointer" ${isChecked ? 'checked' : ''}>
                                                ` : `
                                                    <span class="w-4 h-4 flex items-center justify-center text-emerald-400"><i class="fa-solid fa-check text-[10px]"></i></span>
                                                `}
                                                <div>
                                                    <span class="font-mono font-bold ${isUsed ? 'text-slate-400 line-through' : 'text-yellow-400'} text-sm">${c.code}</span>
                                                    <div class="text-[10px] mt-0.5 flex items-center gap-1.5">
                                                        <span class="px-2 py-0.5 rounded-full font-bold ${isUsed ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-400'}">
                                                            ${isUsed ? 'Já Utilizado' : 'Disponível'}
                                                        </span>
                                                        ${c.usedAt ? `<span class="text-slate-500 text-[9px]">${new Date(c.usedAt).toLocaleDateString()}</span>` : ''}
                                                    </div>
                                                </div>
                                            </div>
                                            <button onclick="deleteCode(${c.id})" class="text-slate-500 hover:text-red-400 p-1.5 rounded-lg transition" title="Excluir código"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                } else if (adminTab === 'results') {
                    const activeCamp = getActiveAdminCampaign(db);
                    const allSpins = db.spins || [];
                    const campSpins = allSpins.filter(s => String(s.campaignId) === String(activeCamp.id));
                    const spins = resultsFilterMode === 'all' ? allSpins : campSpins;
                    const selectedCount = spins.filter(s => selectedSpinIds.has(s.id) || selectedSpinIds.has(String(s.id)) || selectedSpinIds.has(Number(s.id))).length;
                    const allSelected = spins.length > 0 && selectedCount === spins.length;

                    return `
                        <div class="space-y-6">
                            <div class="flex justify-between items-center flex-wrap gap-3">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h2 class="text-2xl font-bold">Resultados dos Giros</h2>
                                        <span class="bg-yellow-500/20 text-yellow-300 border border-yellow-500/40 text-xs px-2.5 py-0.5 rounded-full font-bold">Campanha: ${escapeHtml(activeCamp.name)}</span>
                                    </div>
                                    <p class="text-xs text-slate-400">Histórico de prêmios sorteados pelos clientes (${campSpins.length} nesta campanha, ${allSpins.length} no total)</p>
                                </div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <div class="flex items-center bg-slate-950 border border-slate-700 p-1 rounded-xl text-xs font-bold mr-2">
                                        <button onclick="setResultsFilter('current')" class="px-3 py-1.5 rounded-lg transition ${resultsFilterMode !== 'all' ? 'bg-yellow-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}">
                                            Desta Campanha (${campSpins.length})
                                        </button>
                                        <button onclick="setResultsFilter('all')" class="px-3 py-1.5 rounded-lg transition ${resultsFilterMode === 'all' ? 'bg-yellow-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}">
                                            Todas as Campanhas (${allSpins.length})
                                        </button>
                                    </div>
                                    ${spins.length > 0 ? `
                                        <button onclick="deleteSelectedSpins()" id="btnDeleteSelected" class="${selectedCount > 0 ? 'bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-900/50 cursor-pointer' : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'} px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition" style="touch-action: manipulation;" ${selectedCount > 0 ? '' : 'disabled'}>
                                            <i class="fa-solid fa-trash"></i> Excluir Selecionados (<span id="selectedCountBadge">${selectedCount}</span>)
                                        </button>
                                        <button onclick="clearCurrentCampaignSpins(${activeCamp.id})" class="bg-red-950/40 hover:bg-red-900/50 text-red-300 border border-red-700/40 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition" style="touch-action: manipulation;" title="Limpar giros desta campanha">
                                            <i class="fa-solid fa-dumpster-fire"></i> Excluir Giros desta Campanha
                                        </button>
                                    ` : ''}
                                    <button onclick="exportResultsCSV()" class="bg-slate-700 hover:bg-slate-600 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition" style="touch-action: manipulation;">
                                        <i class="fa-solid fa-download"></i> CSV
                                    </button>
                                </div>
                            </div>

                            ${spins.length > 0 ? `
                                <div class="bg-slate-800/80 border border-slate-700 p-3.5 rounded-2xl flex items-center justify-between gap-3 text-xs">
                                    <label class="flex items-center gap-2.5 cursor-pointer font-bold select-none text-slate-200">
                                        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAllSpins(this.checked)" class="w-4 h-4 rounded text-yellow-500 bg-slate-900 border-slate-600 focus:ring-yellow-400" ${allSelected ? 'checked' : ''}>
                                        <span>Selecionar Todos os Giros Exibidos (${spins.length})</span>
                                    </label>
                                    <span class="text-slate-400 font-medium" id="selectedInfoText">${selectedCount} selecionado(s)</span>
                                </div>
                            ` : ''}

                            <div class="grid gap-4" id="spinsListContainer">
                                ${spins.length === 0 ? `
                                    <div class="bg-slate-800/60 border border-slate-700/60 p-8 rounded-2xl text-center text-slate-400 space-y-2">
                                        <i class="fa-solid fa-clock-rotate-left text-3xl text-slate-600"></i>
                                        <p class="font-medium">Nenhum giro registrado ${resultsFilterMode === 'all' ? 'no sistema' : 'para esta campanha'} ainda.</p>
                                    </div>
                                ` : spins.map(s => {
                                    const isChecked = selectedSpinIds.has(s.id) || selectedSpinIds.has(String(s.id)) || selectedSpinIds.has(Number(s.id));
                                    const spinCamp = (db.campaigns || []).find(c => String(c.id) === String(s.campaignId));
                                    const sCode = String(s.accessCodeId || '').trim().toUpperCase();
                                    const linkedClient = (db.clients || []).find(c => 
                                        (c.codigo && String(c.codigo).trim().toUpperCase() === sCode) ||
                                        (s.clientId && String(c.id) === String(s.clientId)) ||
                                        (c.nome && s.clientName && c.nome.trim().toLowerCase() === s.clientName.trim().toLowerCase())
                                    );
                                    const clientName = (linkedClient ? linkedClient.nome : (s.clientName || '')).trim();
                                    const clientPhone = (linkedClient ? (linkedClient.whatsapp || linkedClient.cleanPhone || '') : (s.clientPhone || '')).trim();
                                    const clientVencimento = (linkedClient ? (linkedClient.vencimento || '') : (s.clientVencimento || '')).trim();
                                    const cleanPhone = linkedClient ? (linkedClient.cleanPhone || clientPhone.replace(/\D/g, '')) : clientPhone.replace(/\D/g, '');
                                    const prizeFull = `${s.prizeNameSnapshot || ''}${s.discountSnapshot ? ' (' + s.discountSnapshot + ')' : ''}`;

                                    const waNotifyMsg = `Olá ${clientName || 'Cliente'}! Parabéns, vimos que você utilizou seu código ${s.accessCodeId} na nossa Roleta da Sorte e foi premiado(a) com: ${prizeFull}! 🎉 Entre em contato conosco para resgatar seu prêmio.`;

                                    return `
                                        <div id="spinCard_${s.id}" class="bg-slate-800 p-5 rounded-2xl border ${isChecked ? 'border-yellow-500/80 bg-slate-800/95 shadow-md shadow-yellow-500/10' : (linkedClient ? 'border-emerald-500/30 bg-slate-800/90' : 'border-slate-700')} space-y-3.5 transition">
                                            <div class="flex justify-between items-start flex-wrap gap-2">
                                                <div class="flex items-start gap-3">
                                                    <input type="checkbox" value="${s.id}" onchange="toggleSpinSelection(${s.id}, this.checked)" class="spin-checkbox w-5 h-5 mt-1 rounded text-yellow-500 bg-slate-900 border-slate-600 focus:ring-yellow-400 cursor-pointer" ${isChecked ? 'checked' : ''}>
                                                    <div>
                                                        <div class="flex items-center gap-2 flex-wrap">
                                                            <span class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 p-1.5 rounded-xl text-sm flex items-center justify-center">
                                                                <i class="fa-solid fa-trophy"></i>
                                                            </span>
                                                            <h3 class="font-bold text-lg text-yellow-400">${escapeHtml(s.prizeNameSnapshot)} (${escapeHtml(s.discountSnapshot)})</h3>
                                                            ${spinCamp ? `<span class="bg-slate-950 text-slate-300 border border-slate-700 text-[10px] px-2 py-0.5 rounded-full font-bold">Campanha: ${escapeHtml(spinCamp.name)}</span>` : ''}
                                                        </div>

        function extractClientPhoneAndVencimento(val1, val2) {
            const s1 = String(val1 || '').trim();
            const s2 = String(val2 || '').trim();

            const isDate1 = /\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4}/.test(s1) || /^\d{4}[\/\-\.]\d{1,2}/.test(s1);
            const isDate2 = /\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4}/.test(s2) || /^\d{4}[\/\-\.]\d{1,2}/.test(s2);

            const digits1 = s1.replace(/\D/g, '');
            const digits2 = s2.replace(/\D/g, '');

            if (isDate1 && !isDate2) {
                return { whatsapp: s2, vencimento: s1 };
            }
            if (isDate2 && !isDate1) {
                return { whatsapp: s1, vencimento: s2 };
            }
            if (digits1.length >= 10 && !s1.includes('/') && s2.includes('/')) {
                return { whatsapp: s1, vencimento: s2 };
            }
            if (digits2.length >= 10 && !s2.includes('/') && s1.includes('/')) {
                return { whatsapp: s2, vencimento: s1 };
            }
            return { whatsapp: s1, vencimento: s2 };
        }

        function parseBulkClientsText(rawText) {
            if (!rawText || !rawText.trim()) return [];
            const text = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const parsed = [];

            // Split by empty lines (blocks)
            const blocks = text.split(/\n\s*\n+/).map(b => b.trim()).filter(Boolean);

            for (const block of blocks) {
                const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
                if (lines.length === 3) {
                    const pair = extractClientPhoneAndVencimento(lines[1], lines[2]);
                    parsed.push({ nome: lines[0], whatsapp: pair.whatsapp, vencimento: pair.vencimento, codigo: null });
                } else if (lines.length === 4) {
                    const pair = extractClientPhoneAndVencimento(lines[1], lines[2]);
                    const l3 = lines[3];
                    if (l3.toUpperCase().startsWith("RLT-") || /^[A-Z0-9-]{5,15}$/i.test(l3)) {
                        parsed.push({ nome: lines[0], whatsapp: pair.whatsapp, vencimento: pair.vencimento, codigo: l3.toUpperCase() });
                    } else {
                        parsed.push({ nome: lines[0], whatsapp: pair.whatsapp, vencimento: pair.vencimento, codigo: l3 });
                    }
                } else if (lines.length > 4) {
                    // Multiple clients inside this block without empty lines
                    let i = 0;
                    while (i < lines.length) {
                        const l0 = lines[i];
                        const l1 = lines[i + 1] || "";
                        const l2 = lines[i + 2] || "";
                        const l3 = lines[i + 3] || "";
                        if (l0 && l1 && l2) {
                            const pair = extractClientPhoneAndVencimento(l1, l2);
                            if (l3 && (l3.toUpperCase().startsWith("RLT-") || /^[A-Z0-9-]{5,15}$/i.test(l3))) {
                                parsed.push({ nome: l0, whatsapp: pair.whatsapp, vencimento: pair.vencimento, codigo: l3.toUpperCase() });
                                i += 4;
                            } else {
                                parsed.push({ nome: l0, whatsapp: pair.whatsapp, vencimento: pair.vencimento, codigo: null });
                                i += 3;
                            }
                        } else {
                            i++;
                        }
                    }
                } else if (lines.length === 1 && (lines[0].includes(';') || lines[0].includes(',') || lines[0].includes('\t'))) {
                    const parts = lines[0].split(/[;,\t|]+/).map(p => p.trim()).filter(Boolean);
                    if (parts.length >= 3) {
                        const pair = extractClientPhoneAndVencimento(parts[1], parts[2]);
                        parsed.push({
                            nome: parts[0],
                            whatsapp: pair.whatsapp,
                            vencimento: pair.vencimento,
                            codigo: parts[3] ? parts[3].toUpperCase() : null
                        });
                    }
                }
            }

            return parsed;
        }

        function processBulkClients(campaignId) {
            const input = document.getElementById('bulkClientsInput');
            const rawText = input ? input.value : bulkInputTextMemory;
            if (!rawText || !rawText.trim()) {
                alert("Por favor, cole os dados dos clientes no campo antes de processar.");
                return;
            }

            const rawList = parseBulkClientsText(rawText);
            if (rawList.length === 0) {
                alert("Não foi possível identificar clientes no texto informado. Certifique-se de informar Nome, WhatsApp e Vencimento para cada cliente.");
                return;
            }

            const db = loadDB();
            if (!db.clients) db.clients = [];
            if (!db.codes) db.codes = [];

            let addedCount = 0;
            const now = Date.now();

            rawList.forEach((item, index) => {
                const rawPhone = String(item.whatsapp || '');
                const cleanDigits = rawPhone.replace(/\D/g, '');
                
                // Formatted Brazilian phone display
                let formattedPhone = rawPhone;
                if (cleanDigits.length === 11) {
                    formattedPhone = `(${cleanDigits.slice(0, 2)}) ${cleanDigits.slice(2, 7)}-${cleanDigits.slice(7)}`;
                } else if (cleanDigits.length === 10) {
                    formattedPhone = `(${cleanDigits.slice(0, 2)}) ${cleanDigits.slice(2, 6)}-${cleanDigits.slice(6)}`;
                }

                // WhatsApp international standard for wa.me
                let phoneForWa = cleanDigits;
                if (!phoneForWa.startsWith('55') && (phoneForWa.length === 10 || phoneForWa.length === 11)) {
                    phoneForWa = '55' + phoneForWa;
                }

                // Code assignment: use provided or generate fresh valid code
                let codeToUse = item.codigo ? item.codigo.trim().toUpperCase() : null;
                if (!codeToUse) {
                    const rand = Math.random().toString(36).substring(2, 8).toUpperCase();
                    codeToUse = `RLT-${rand}`;
                }

                // Ensure the code exists in db.codes as AVAILABLE for this campaign
                const existingCode = db.codes.find(c => String(c.campaignId) === String(campaignId) && c.code === codeToUse);
                if (!existingCode) {
                    db.codes.push({
                        id: now + index + Math.random(),
                        campaignId: campaignId,
                        code: codeToUse,
                        status: "AVAILABLE",
                        usedAt: null
                    });
                }

                const newClient = {
                    id: now + index + Math.random(),
                    campaignId: campaignId,
                    nome: String(item.nome || '').trim(),
                    whatsapp: formattedPhone,
                    cleanPhone: phoneForWa,
                    vencimento: String(item.vencimento || '').trim(),
                    codigo: codeToUse,
                    sent: false,
                    sentAt: null,
                    createdAt: now
                };

                db.clients.unshift(newClient);
                addedCount++;
            });

            bulkInputTextMemory = '';
            if (input) input.value = '';

            saveDB(db, true);
            showToast(`${addedCount} cliente(s) organizado(s) com códigos válidos gerados!`, "success");
            router();
        }

        function sendWhatsAppToClient(clientId) {
            const db = loadDB();
            const client = (db.clients || []).find(c => String(c.id) === String(clientId));
            if (!client) return;

            const campaign = (db.campaigns || []).find(c => String(c.id) === String(client.campaignId)) || getActiveAdminCampaign(db);
            const settings = getActiveSettings(db, campaign.id);
            const defaultTemplate = "Olá {nome}! Seu plano vence em {vencimento}.\nVocê ganhou um giro exclusivo na nossa Roleta da Sorte!\nAcesse o link abaixo e use o seu código para liberar a roleta:\n{link}\nSeu código: {codigo}\nBoa sorte! 🎉";
            const promoTemplate = settings.promo_message || defaultTemplate;

            const origin = window.location.origin;
            const path = window.location.pathname;
            const publicLink = `${origin}${path}#roleta/${campaign.slug}`;

            const message = promoTemplate
                .replace(/{nome}/g, client.nome)
                .replace(/{whatsapp}/g, client.whatsapp)
                .replace(/{vencimento}/g, client.vencimento)
                .replace(/{codigo}/g, client.codigo)
                .replace(/{link}/g, publicLink)
                .replace(/{campanha}/g, campaign.name);

            // Mark client as sent
            client.sent = true;
            client.sentAt = Date.now();
            saveDB(db, false);

            const waUrl = `https://wa.me/${client.cleanPhone}?text=${encodeURIComponent(message)}`;
            window.open(waUrl, '_blank');
            showToast(`WhatsApp aberto para ${client.nome}! Marcado como Enviado.`, "success");
            router();
        }
