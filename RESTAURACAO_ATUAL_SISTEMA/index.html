        function copyCampaignLink(slug) {
            const url = window.location.origin + window.location.pathname + '#roleta/' + slug;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast(`Link copiado: /#roleta/${slug}`, "success");
                }).catch(() => {
                    fallbackCopy(url, slug);
                });
            } else {
                fallbackCopy(url, slug);
            }
        }

        function fallbackCopy(text, slug) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand("copy");
                showToast(`Link copiado: /#roleta/${slug}`, "success");
            } catch (e) {
                prompt("Copie o link público:", text);
            }
            document.body.removeChild(ta);
        }

        function autoGenerateSlug(val) {
            const slugInput = document.getElementById("m_camp_slug");
            if (!slugInput) return;
            const clean = val.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");
            slugInput.value = clean;
        }

        function deleteCampaign(id) {
            const db = loadDB();
            const camps = db.campaigns || [];
            if (camps.length <= 1) {
                alert("Não é possível excluir a única campanha restante.");
                return;
            }
            const camp = camps.find(c => String(c.id) === String(id));
            const campName = camp ? camp.name : "Campanha";

            if (!confirm(`Tem certeza que deseja excluir a campanha "${campName}" e todos os seus prêmios, códigos e giros vinculados? Esta ação não pode ser desfeita.`)) {
                return;
            }

            db.campaigns = camps.filter(c => String(c.id) !== String(id));
            if (db.prizes) db.prizes = db.prizes.filter(p => String(p.campaignId) !== String(id));
            if (db.codes) db.codes = db.codes.filter(c => String(c.campaignId) !== String(id));
            if (db.spins) db.spins = db.spins.filter(s => String(s.campaignId) !== String(id));
            if (db.settings && db.settings[id]) delete db.settings[id];

            if (String(selectedAdminCampaignId) === String(id)) {
                selectedAdminCampaignId = db.campaigns[0].id;
                localStorage.setItem("roleta_selected_campaign_id", String(selectedAdminCampaignId));
            }

            saveDB(db);
            showToast(`Campanha "${campName}" excluída com sucesso!`, "success");
            router();
        }

                                <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Texto na Mensagem de Parabéns</label>
                                <input type="text" id="m_prize_result" value="${prize ? escapeHtml(prize.resultText || prize.name) : ''}" placeholder="ex: 15% DE DESCONTO EXCLUSIVO" class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-xl text-white" style="font-size: 16px !important;">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Peso (Probabilidade)</label>
                                    <input type="number" id="m_prize_weight" value="${prize ? (prize.weight || 20) : 20}" min="1" class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-xl text-white font-mono" style="font-size: 16px !important;">
                                </div>
                                <div>
                                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Estoque</label>
                                    <input type="number" id="m_prize_quantity" value="${prize ? (prize.quantity !== undefined ? prize.quantity : 100) : 100}" min="0" class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-xl text-white font-mono" style="font-size: 16px !important;">
                                </div>
                            </div>
                            <div class="flex items-center gap-2 pt-1">
                                <input type="checkbox" id="m_prize_unlimited" ${prize && prize.unlimitedQuantity ? 'checked' : ''} class="w-4 h-4 rounded text-yellow-500 bg-slate-950 border-slate-700">
                                <label for="m_prize_unlimited" class="text-xs text-slate-300">Estoque ilimitado (nunca esgota)</label>
                            </div>
                        </div>
                        <div class="flex gap-3 pt-3">
                            <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm" style="touch-action: manipulation;">Cancelar</button>
                            <button onclick="savePrizeFromModal(${prizeId ? prizeId : 'null'}, ${campaignId})" class="flex-1 py-3 rounded-xl bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black text-sm uppercase tracking-wider shadow-lg" style="touch-action: manipulation;">Salvar Prêmio</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById("modalContainer").innerHTML = "";
        }

        function updateBgImagePreview(url) {
            const container = document.getElementById("bgImagePreviewContainer");
            const img = document.getElementById("bgImagePreviewImg");
            if (!container || !img) return;
            if (url && url.trim()) {
                img.src = url.trim();
                container.classList.remove("hidden");
            } else {
                container.classList.add("hidden");
            }
        }

        function handleBgFileUpload(input, campId) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            if (file.size > 4 * 1024 * 1024) {
                alert("A imagem selecionada é muito grande. Escolha uma imagem de até 4MB.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                const urlInput = document.getElementById("st_bg_image");
                if (urlInput) urlInput.value = dataUrl;
                handleSettingsChange('bg_image', dataUrl, campId);
                updateBgImagePreview(dataUrl);
                showToast("Imagem de fundo carregada! Clique em Salvar Configurações.", "info");
            };
            reader.readAsDataURL(file);
        }

        function handleRemoveBgImage(campId) {
            const urlInput = document.getElementById("st_bg_image");
            if (urlInput) urlInput.value = "";
            handleSettingsChange('bg_image', '', campId);
            updateBgImagePreview('');
            const db = loadDB();
            if (db.settings && db.settings[campId]) {
                db.settings[campId].bg_image = "";
                saveDB(db, false);
            }
            showToast("Imagem de fundo removida. Usando cor sólida.", "info");
            router();
        }

        function savePrizeFromModal(prizeId, campaignId) {
            const name = document.getElementById("m_prize_name").value.trim();
            if (!name) {
                alert("Por favor, preencha o nome do prêmio.");
                return;
            }
            const displayText = document.getElementById("m_prize_display").value.trim() || name;
            const resultText = document.getElementById("m_prize_result").value.trim() || name;
            const weight = parseInt(document.getElementById("m_prize_weight").value) || 10;
            const quantity = parseInt(document.getElementById("m_prize_quantity").value) || 0;
            const unlimitedQuantity = document.getElementById("m_prize_unlimited").checked;

            const db = loadDB();
            if (!db.prizes) db.prizes = [];

            if (prizeId) {
                const idx = db.prizes.findIndex(p => p.id == prizeId);
                if (idx !== -1) {
                    db.prizes[idx].name = name;
                    db.prizes[idx].displayText = displayText;
                    db.prizes[idx].discount = displayText;
                    db.prizes[idx].resultText = resultText;
                    db.prizes[idx].weight = weight;
                    db.prizes[idx].quantity = quantity;
                    db.prizes[idx].unlimitedQuantity = unlimitedQuantity;
                }
            } else {
                const newPrize = {
                    id: Date.now(),
                    campaignId: campaignId,
                    name: name,
                    description: "Prêmio da roleta",
                    displayText: displayText,
                    discount: displayText,
                    resultText: resultText,
                    weight: weight,
                    quantity: quantity,
                    unlimitedQuantity: unlimitedQuantity,
                    active: true
                };
                db.prizes.push(newPrize);
            }

            closeModal();
            saveDB(db);
            showToast("Prêmio salvo e sincronizado com o Supabase!", "success");
            router();
        }

        function togglePrize(id) {
            const db = loadDB();
            const p = (db.prizes || []).find(p => p.id == id);
            if (p) {
                p.active = (p.active === false);
                saveDB(db);
                router();
            }
        }

        function deletePrize(id) {
            if (!confirm("Tem certeza que deseja excluir este prêmio?")) return;
            const db = loadDB();
            db.prizes = (db.prizes || []).filter(p => p.id != id);
            saveDB(db);
            showToast("Prêmio excluído com sucesso!", "success");
            router();
        }

        function generateCodes(campaignId, count) {
            const db = loadDB();
            if (!db.codes) db.codes = [];
            for (let i = 0; i < count; i++) {
                const rand = Math.random().toString(36).substring(2, 8).toUpperCase();
                db.codes.push({
                    id: Date.now() + i + Math.random(),
                    campaignId: campaignId,
                    code: `RLT-${rand}`,
                    status: "AVAILABLE",
                    usedAt: null
                });
            }
            saveDB(db);
            showToast(`${count} novos códigos gerados e salvos!`, "success");
            router();
        }

        function deleteCode(id) {
            const db = loadDB();
            db.codes = (db.codes || []).filter(c => c.id != id);
            selectedCodeIds.delete(id);
            selectedCodeIds.delete(String(id));
            selectedCodeIds.delete(Number(id));
            saveDB(db);
            showToast("Código excluído com sucesso!", "success");
            router();
        }

        function updateSelectedCodesUI() {
            const db = loadDB();
            const codes = db.codes || [];
            const usedCodes = codes.filter(c => c.status === 'USED');
            const selectedUsedCodes = usedCodes.filter(c => selectedCodeIds.has(c.id) || selectedCodeIds.has(String(c.id)) || selectedCodeIds.has(Number(c.id)));
            const count = selectedUsedCodes.length;

            const countBadge = document.getElementById("selectedUsedCountBadge");
            if (countBadge) countBadge.innerText = count;

            const infoText = document.getElementById("selectedUsedInfoText");
            if (infoText) infoText.innerText = `${count} selecionado(s)`;

            const selectAll = document.getElementById("selectAllUsedCodesCheckbox");
            if (selectAll) selectAll.checked = usedCodes.length > 0 && count === usedCodes.length;

            const btnDelete = document.getElementById("btnDeleteSelectedCodes");
            if (btnDelete) {
                if (count > 0) {
                    btnDelete.disabled = false;
                    btnDelete.className = "bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-900/50 px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer";
                } else {
                    btnDelete.disabled = true;
                    btnDelete.className = "bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition";
                }
            }
        }

        function toggleSelectAllUsedCodes(checked) {
            const db = loadDB();
            const codes = db.codes || [];
            const usedCodes = codes.filter(c => c.status === 'USED');

            if (checked) {
                usedCodes.forEach(c => {
                    selectedCodeIds.add(c.id);
                    selectedCodeIds.add(String(c.id));

            } else {
                usedCodes.forEach(c => {
                    selectedCodeIds.delete(c.id);
                    selectedCodeIds.delete(String(c.id));
                    selectedCodeIds.delete(Number(c.id));
                });

            document.querySelectorAll('.used-code-checkbox').forEach(cb => {

                selectedCodeIds.delete(String(id));

        function deleteSelectedUsedCodes() {
            if (selectedCodeIds.size === 0) return;
            const db = loadDB();
            const selectedCodes = (db.codes || []).filter(c => selectedCodeIds.has(c.id) || selectedCodeIds.has(String(c.id)) || selectedCodeIds.has(Number(c.id)));
            const count = selectedCodes.length;
            if (count === 0) return;

            if (!confirm(`Tem certeza que deseja excluir os ${count} código(s) já usados selecionado(s)?`)) return;

            db.codes = (db.codes || []).filter(c => !selectedCodeIds.has(c.id) && !selectedCodeIds.has(String(c.id)) && !selectedCodeIds.has(Number(c.id)));
            selectedCodeIds.clear();
            saveDB(db);
            showToast(`${count} código(s) usado(s) excluído(s) com sucesso!`, "success");
            router();
        }

        function deleteAllUsedCodes(campaignId) {
            const db = loadDB();
            const usedCount = (db.codes || []).filter(c => String(c.campaignId) === String(campaignId) && c.status === 'USED').length;
            if (usedCount === 0) {
                showToast("Não há códigos usados para excluir.", "warning");
                return;
            }

            if (!confirm(`Atenção: Tem certeza que deseja excluir TODOS os ${usedCount} códigos já utilizados? Esta ação não pode ser desfeita.`)) return;

            db.codes = (db.codes || []).filter(c => !(String(c.campaignId) === String(campaignId) && c.status === 'USED'));
            selectedCodeIds.clear();
            saveDB(db);
            showToast(`Todos os ${usedCount} códigos usados foram excluídos com sucesso!`, "success");
            router();
        }

        function updateSpinClient(id, field, value) {
            const db = loadDB();
            const spin = (db.spins || []).find(s => s.id == id);
            if (spin) {
                spin[field] = value;
                saveDB(db, false);
            }
        }

                selectedSpinIds.delete(id);
                selectedSpinIds.delete(String(id));

        function deleteSelectedSpins() {

            saveDB(db);
            showToast(`${count} giro(s) excluído(s) com sucesso!`, "success");

            selectedSpinIds.delete(id);
            selectedSpinIds.delete(String(id));
            selectedSpinIds.delete(Number(id));
            saveDB(db);
            showToast("Giro excluído com sucesso!", "success");

        function clearAllSpins() {
            const db = loadDB();
            const total = (db.spins || []).length;
            if (total === 0) return;
            if (!confirm(`Atenção: Tem certeza que deseja excluir TODOS os ${total} giros computados? Esta ação não pode ser desfeita.`)) return;

            db.spins = [];
            selectedSpinIds.clear();
            saveDB(db);
            showToast("Todos os giros foram excluídos!", "success");
            router();

        function clearCurrentCampaignSpins(campaignId) {
            const db = loadDB();
            const campSpins = (db.spins || []).filter(s => String(s.campaignId) === String(campaignId));
            const count = campSpins.length;
            if (count === 0) {
                showToast("Não há giros para excluir nesta campanha.", "warning");
                return;
            }
            if (!confirm(`Atenção: Tem certeza que deseja excluir os ${count} giros computados DESTA CAMPANHA? Esta ação não pode ser desfeita.`)) return;

            db.spins = (db.spins || []).filter(s => String(s.campaignId) !== String(campaignId));
            selectedSpinIds.clear();
            saveDB(db);
            showToast(`${count} giro(s) desta campanha excluído(s) com sucesso!`, "success");
            router();
        }

        function saveSettings(campaignId) {
            const db = loadDB();
            if (!db.settings) db.settings = {};

            const titleVal = document.getElementById("st_title") ? document.getElementById("st_title").value : (settingsDraft.title || "ROLETA DA SORTE");
            const subtitleVal = document.getElementById("st_subtitle") ? document.getElementById("st_subtitle").value : (settingsDraft.subtitle || "");
            const spinBtnVal = document.getElementById("st_spin_btn") ? document.getElementById("st_spin_btn").value : (settingsDraft.spin_button || "CLIQUE AQUI E GIRE A ROLETA");
            const libBtnVal = document.getElementById("st_lib_btn") ? document.getElementById("st_lib_btn").value : (settingsDraft.liberate_button || "LIBERAR ROLETA");
            const bgVal = document.getElementById("st_bg") ? document.getElementById("st_bg").value : (settingsDraft.bg_color || "#060913");
            const bgImageVal = document.getElementById("st_bg_image") ? document.getElementById("st_bg_image").value : (settingsDraft.bg_image || "");
            const btnVal = document.getElementById("st_btn") ? document.getElementById("st_btn").value : (settingsDraft.btn_color || "#FACC15");

            const updatedSettings = {
                title: titleVal,
                subtitle: subtitleVal,
                spin_button: spinBtnVal,
                liberate_button: libBtnVal,
                bg_color: bgVal,
                bg_image: bgImageVal,
                btn_color: btnVal,
                text_color: "#FFFFFF",
                btn_text_color: "#1E1B4B",
                code_placeholder: "Digite seu código (ex: RLT-7X92KP)",
                valid_code_msg: "Código validado com sucesso!",
                spinning_msg: "Girando roleta...",
                result_title: "🎉 PARABÉNS! 🎉",
                result_prize_prefix: "VOCÊ GANHOU",
                result_success_msg: "Seu prêmio foi registrado com sucesso no sistema."
            };

            settingsDraft = { campaignId: campaignId, ...updatedSettings };

            db.settings[campaignId] = { ...(db.settings[campaignId] || {}), ...updatedSettings };
            
            saveDB(db, true);

            // Animate button feedback without destroying or re-rendering DOM
            const btn = document.getElementById("btnSaveSettings");
            if (btn) {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> <span>Salvo com Sucesso no Supabase!</span>`;
                btn.classList.remove("bg-yellow-500", "hover:bg-yellow-400");
                btn.classList.add("bg-emerald-500", "hover:bg-emerald-400");
                setTimeout(() => {
                    if (btn) {
                        btn.innerHTML = originalHtml;
                        btn.classList.add("bg-yellow-500", "hover:bg-yellow-400");
                        btn.classList.remove("bg-emerald-500", "hover:bg-emerald-400");
                    }
                }, 2500);
            }
        }

        function exportCodesCSV() {
            const db = loadDB();
            const activeCamp = getActiveAdminCampaign(db);
            let csv = "Campanha,Codigo,Status,DataUtilizacao\n";
            (db.codes || []).filter(c => String(c.campaignId) === String(activeCamp.id)).forEach(c => {
                csv += `"${activeCamp.name}",${c.code},${c.status},${c.usedAt ? new Date(c.usedAt).toISOString() : ''}\n`;
            });
            downloadCSV(csv, `codigos_${activeCamp.slug}.csv`);
        }

        function exportResultsCSV() {
            const db = loadDB();
            const activeCamp = getActiveAdminCampaign(db);
            const allSpins = db.spins || [];
            const spinsToExport = resultsFilterMode === 'all' ? allSpins : allSpins.filter(s => String(s.campaignId) === String(activeCamp.id));
            let csv = "Campanha,Codigo,Cliente,WhatsApp,Vencimento,Premio,Valor,Data,Observacao\n";
            spinsToExport.forEach(s => {
                const cName = ((db.campaigns || []).find(c => String(c.id) === String(s.campaignId)) || {}).name || activeCamp.name;
                const sCode = String(s.accessCodeId || '').trim().toUpperCase();
                const linkedClient = (db.clients || []).find(c => 
                    (c.codigo && String(c.codigo).trim().toUpperCase() === sCode) ||
                    (s.clientId && String(c.id) === String(s.clientId)) ||
                    (c.nome && s.clientName && c.nome.trim().toLowerCase() === s.clientName.trim().toLowerCase())
                );
                const clientName = (linkedClient ? linkedClient.nome : (s.clientName || '')).trim();
                const clientPhone = (linkedClient ? (linkedClient.whatsapp || linkedClient.cleanPhone || '') : (s.clientPhone || '')).trim();
                const clientVencimento = (linkedClient ? (linkedClient.vencimento || '') : (s.clientVencimento || '')).trim();
                csv += `"${cName}","${s.accessCodeId}","${clientName}","${clientPhone}","${clientVencimento}","${s.prizeNameSnapshot}","${s.discountSnapshot}","${new Date(s.createdAt).toISOString()}","${s.observation || ''}"\n`;
            });
            downloadCSV(csv, resultsFilterMode === 'all' ? "resultados_todas_campanhas.csv" : `resultados_${activeCamp.slug}.csv`);
        }

        function downloadCSV(csv, filename) {
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', filename);
            a.style.visibility = 'hidden';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
