<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta da Sorte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gold-text {
            background: linear-gradient(180deg, #FFFDF0 0%, #FDE047 50%, #CA8A04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.8));
        }
        .gold-btn {
            background: linear-gradient(180deg, #FEF08A 0%, #FACC15 50%, #B45309 100%);
            box-shadow: 0 8px 30px rgba(250, 204, 21, 0.7), inset 0 2px 4px rgba(255,255,255,0.9), inset 0 -2px 4px rgba(120,53,15,0.9);
        }
        .casino-rim {
            background: radial-gradient(circle, #FEF08A 0%, #EAB308 50%, #78350F 100%);
            box-shadow: 0 0 70px rgba(234, 179, 8, 0.8), inset 0 0 25px rgba(255,255,255,0.8);
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }
        .casino-bulb {
            animation: pulse-glow 1s infinite alternate;
        }
    </style>
</head>
<body class="bg-[#060913] text-white min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col relative z-10">
        <!-- Rendered dynamically by JS -->
    </div>

    <script>
        // --- Database & LocalStorage State Management ---
        const DB_KEY = "roleta_db_v1";

        function getInitialData() {
            return {
                campaigns: [
                    { id: 1, name: "Outubro Premiado", slug: "outubro", active: true }
                ],
                prizes: [
                    { id: 1, campaignId: 1, name: "R$ 5 de Desconto", description: "Desconto em compras acima de R$ 50", displayText: "R$ 5 OFF", resultText: "R$ 5 DE DESCONTO", discount: "R$ 5", weight: 40, quantity: 500, unlimitedQuantity: false, active: true },
                    { id: 2, campaignId: 1, name: "Frete Grátis", description: "Frete grátis para todo o Brasil", displayText: "Frete Grátis", resultText: "FRETE GRÁTIS", discount: "Frete Grátis", weight: 30, quantity: 200, unlimitedQuantity: false, active: true },
                    { id: 3, campaignId: 1, name: "R$ 20 de Desconto", description: "Desconto especial em qualquer produto", displayText: "R$ 20 OFF", resultText: "R$ 20 DE DESCONTO", discount: "R$ 20", weight: 20, quantity: 50, unlimitedQuantity: false, active: true },
                    { id: 4, campaignId: 1, name: "Brinde Surpresa", description: "Um brinde exclusivo no seu pedido", displayText: "Brinde", resultText: "BRINDE SURPRESA", discount: "Brinde", weight: 8, quantity: 20, unlimitedQuantity: false, active: true },
                    { id: 5, campaignId: 1, name: "R$ 100 de Desconto", description: "Prêmio máximo da roleta!", displayText: "R$ 100 OFF", resultText: "R$ 100 DE DESCONTO", discount: "R$ 100", weight: 2, quantity: 5, unlimitedQuantity: false, active: true }
                ],
                codes: [
                    { id: 1, campaignId: 1, code: "RLT-7X92KP", status: "AVAILABLE", usedAt: null },
                    { id: 2, campaignId: 1, code: "RLT-4M8Q2A", status: "AVAILABLE", usedAt: null },
                    { id: 3, campaignId: 1, code: "RLT-9ZK31B", status: "AVAILABLE", usedAt: null },
                    { id: 4, campaignId: 1, code: "RLT-2P7X8M", status: "AVAILABLE", usedAt: null },
                    { id: 5, campaignId: 1, code: "RLT-TEST01", status: "AVAILABLE", usedAt: null }
                ],
                spins: [],
                settings: {
                    1: {
                        title: "ROLETA DA SORTE",
                        subtitle: "Gire a roleta e ganhe descontos e benefícios incríveis!",
                        code_placeholder: "Digite seu código (ex: RLT-7X92KP)",
                        liberate_button: "LIBERAR ROLETA",
                        valid_code_msg: "Código validado com sucesso!",
                        spin_button: "CLIQUE AQUI E GIRE A ROLETA",
                        spinning_msg: "Girando roleta...",
                        result_title: "🎉 PARABÉNS! 🎉",
                        result_prize_prefix: "VOCÊ GANHOU",
                        result_success_msg: "Seu prêmio foi registrado com sucesso no sistema.",
                        bg_color: "#060913",
                        text_color: "#FFFFFF",
                        btn_color: "#FACC15",
                        btn_text_color: "#1E1B4B"
                    }
                }
            };
        }

        function loadDB() {
            const data = localStorage.getItem(DB_KEY);
            if (!data) {
                const initial = getInitialData();
                saveDB(initial);
                return initial;
            }
            try {
                return JSON.parse(data);
            } catch (e) {
                const initial = getInitialData();
                saveDB(initial);
                return initial;
            }
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        // --- Router & App State ---
        let currentCodeObj = null;
        let isSpinning = false;
        let lastWonPrize = null;
        let currentRotation = 0;

        function router() {
            const hash = window.location.hash;
            const app = document.getElementById("app");
            const db = loadDB();

            if (hash.startsWith("#admin")) {
                renderAdmin(app, db);
            } else {
                let slug = "outubro";
                if (hash.startsWith("#roleta/")) {
                    slug = hash.replace("#roleta/", "");
                }
                const campaign = db.campaigns.find(c => c.slug === slug) || db.campaigns[0];
                renderPublicRoleta(app, db, campaign);
            }
        }

        window.addEventListener("hashchange", router);
        window.addEventListener("load", router);

        // --- Public Roleta Screen ---
        function renderPublicRoleta(container, db, campaign) {
            if (!campaign || !campaign.active) {
                container.innerHTML = `
                    <div class="flex-1 flex items-center justify-center p-6 text-center">
                        <div class="bg-slate-900 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-800">
                            <h1 class="text-2xl font-bold text-red-500 mb-2">Campanha Indisponível</h1>
                            <p class="text-slate-400">Esta campanha de prêmios está encerrada ou não existe.</p>
                        </div>
                    </div>
                `;
                return;
            }

            const settings = db.settings[campaign.id] || db.settings[1];
            const prizes = db.prizes.filter(p => p.campaignId === campaign.id && p.active && (p.unlimitedQuantity || p.quantity > 0));

            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-4 relative" style="background-color: ${settings.bg_color}; color: ${settings.text_color};">
                    <div class="max-w-md w-full text-center px-4 py-6 flex flex-col items-center">
                        
                        <!-- Header Title matching reference image -->
                        <div class="mb-4 text-center">
                            <h2 class="text-xs font-extrabold tracking-[0.4em] text-white uppercase opacity-90">ROLETA DA</h2>
                            <h1 class="text-4xl sm:text-5xl font-black tracking-wider gold-text uppercase flex items-center justify-center gap-2">
                                SORTE <i class="fa-solid fa-clover text-yellow-400 text-3xl"></i>
                            </h1>
                            <p class="text-xs sm:text-sm font-semibold text-yellow-100/90 mt-2 max-w-xs mx-auto">${settings.subtitle}</p>
                        </div>

                        <!-- Wheel Container with Casino Glowing Rim & Bulbs -->
                        <div class="relative w-80 h-80 sm:w-88 sm:h-88 mx-auto mb-6 flex items-center justify-center">
                            <!-- Outer Casino Rim with Bulbs -->
                            <div class="absolute inset-0 rounded-full casino-rim p-5 flex items-center justify-center shadow-[0_0_80px_rgba(234,179,8,0.8)]">
                                <!-- Glowing Light Bulbs Around Rim -->
                                <div class="absolute inset-2 rounded-full border-2 border-dashed border-yellow-100/60 pointer-events-none"></div>
                                <div class="absolute top-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]"></div>
                                <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]" style="animation-delay: 0.3s;"></div>
                                <div class="absolute left-1 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]" style="animation-delay: 0.6s;"></div>
                                <div class="absolute right-1 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]" style="animation-delay: 0.9s;"></div>
                                <div class="absolute top-6 left-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.2s;"></div>
                                <div class="absolute top-6 right-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.5s;"></div>
                                <div class="absolute bottom-6 left-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.7s;"></div>
                                <div class="absolute bottom-6 right-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.4s;"></div>

                                <!-- Inner Wheel Background -->
                                <div class="w-full h-full rounded-full bg-slate-950 relative flex items-center justify-center overflow-hidden border-2 border-yellow-400 shadow-inner">
                                    <canvas id="wheelCanvas" width="320" height="320" class="w-full h-full rounded-full transition-transform duration-[5000ms] cubic-bezier(0.15, 0, 0.15, 1)"></canvas>
                                </div>
                            </div>

                            <!-- Center Gold Cap with Star -->
                            <div class="absolute w-16 h-16 rounded-full bg-gradient-to-tr from-yellow-700 via-yellow-400 to-yellow-200 shadow-2xl flex items-center justify-center border-4 border-yellow-100 z-20">
                                <div class="w-10 h-10 rounded-full bg-slate-950 flex items-center justify-center shadow-inner">
                                    <i class="fa-solid fa-star text-yellow-400 text-xl"></i>
                                </div>
                            </div>

                            <!-- Top Casino Pointer -->
                            <div class="absolute -top-3 w-10 h-11 bg-gradient-to-b from-red-500 via-red-600 to-red-900 shadow-[0_5px_15px_rgba(0,0,0,0.8)] rounded-b-xl flex items-center justify-center border-2 border-yellow-300 z-30">
                                <div class="w-4 h-4 bg-yellow-300 rounded-full shadow-[0_0_10px_#FDE047] mb-2"></div>
                            </div>
                        </div>

                        <!-- Interaction Area -->
                        <div id="interactionArea" class="w-full">
                            ${!currentCodeObj ? `
                                <div class="space-y-4 bg-slate-900/95 backdrop-blur-md p-6 rounded-3xl border border-yellow-500/40 shadow-2xl">
                                    <input type="text" id="codeInput" placeholder="${settings.code_placeholder}" class="w-full px-4 py-3.5 rounded-2xl bg-slate-950 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-yellow-400 text-center font-bold tracking-wider uppercase text-sm shadow-inner">
                                    <button onclick="validateCode(${campaign.id})" class="w-full py-4 rounded-2xl font-black text-base gold-btn text-indigo-950 hover:scale-[1.02] active:scale-[0.98] transition uppercase tracking-wider shadow-lg">
                                        ${settings.liberate_button}
                                    </button>
                                    <div id="codeError" class="text-red-400 text-xs font-semibold"></div>
                                </div>
                            ` : !lastWonPrize ? `
                                <div class="space-y-3">
                                    <p class="text-emerald-400 font-bold text-sm bg-emerald-950/60 py-2.5 px-4 rounded-xl border border-emerald-500/40 shadow-md">${settings.valid_code_msg}</p>
                                    <button onclick="spinWheel(${campaign.id})" id="spinBtn" class="w-full py-5 rounded-2xl font-black text-lg sm:text-xl gold-btn text-indigo-950 shadow-[0_8px_35px_rgba(250,204,21,0.8)] hover:scale-[1.02] active:scale-[0.98] transition uppercase tracking-wider flex items-center justify-center gap-3">
                                        <span>${settings.spin_button}</span>
                                        <i class="fa-solid fa-hand-pointer text-xl animate-bounce"></i>
                                    </button>
                                </div>
                            ` : `
                                <div class="bg-slate-900/95 border border-yellow-500/60 p-6 rounded-3xl shadow-2xl space-y-3 backdrop-blur-md">
                                    <h2 class="text-2xl font-black text-yellow-400">${settings.result_title}</h2>
                                    <p class="text-xs uppercase tracking-widest text-slate-400">${settings.result_prize_prefix}</p>
                                    <div class="text-3xl font-black text-white drop-shadow-[0_2px_8px_rgba(251,191,36,0.7)]">${lastWonPrize.resultText || lastWonPrize.name}</div>
                                    <p class="text-sm text-slate-300">${lastWonPrize.description}</p>
                                    <p class="text-xs text-yellow-400/80 mt-2 font-medium">${settings.result_success_msg}</p>
                                    <button onclick="location.reload()" class="mt-4 px-6 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-yellow-400 font-bold text-xs uppercase tracking-wider transition shadow-md">Girar Novamente</button>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;

            drawWheel(prizes, currentRotation);
        }

        function drawWheel(prizes, rotationAngle) {
            const canvas = document.getElementById("wheelCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const width = canvas.width;
            const height = canvas.height;
            const center = width / 2;
            const radius = center - 6;

            ctx.clearRect(0, 0, width, height);

            if (prizes.length === 0) return;

            const sliceAngle = (2 * Math.PI) / prizes.length;
            const colors = ["#7C3AED", "#2563EB", "#059669", "#DB2777", "#EA580C", "#4F46E5", "#0D9488", "#CA8A04"];

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(rotationAngle * Math.PI / 180);
            ctx.translate(-center, -center);

            prizes.forEach((prize, i) => {
                const startAngle = i * sliceAngle;
                const endAngle = (i + 1) * sliceAngle;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = "#FDE047";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#FFFFFF";
                ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
                ctx.shadowBlur = 10;
                ctx.font = "bold 15px sans-serif";
                ctx.fillText(prize.displayText || prize.name, radius - 24, 6);
                ctx.restore();
            });

            ctx.restore();
        }

        function validateCode(campaignId) {
            const input = document.getElementById("codeInput").value.trim().toUpperCase();
            const db = loadDB();
            const errDiv = document.getElementById("codeError");

            if (!input) {
                errDiv.innerText = "Por favor, digite um código.";
                return;
            }

            const codeObj = db.codes.find(c => c.campaignId === campaignId && c.code === input);
            if (!codeObj) {
                errDiv.innerText = "Código inválido.";
                return;
            }

            if (codeObj.status === "USED") {
                errDiv.innerText = "Este código já foi utilizado.";
                return;
            }

            if (codeObj.status === "INACTIVE") {
                errDiv.innerText = "Este código está inativo.";
                return;
            }

            currentCodeObj = codeObj;
            errDiv.innerText = "";
            router();
        }

        function spinWheel(campaignId) {
            if (isSpinning || !currentCodeObj) return;
            isSpinning = true;

            const db = loadDB();
            const prizes = db.prizes.filter(p => p.campaignId === campaignId && p.active && (p.unlimitedQuantity || p.quantity > 0));

            if (prizes.length === 0) {
                alert("Nenhum prêmio disponível.");
                isSpinning = false;
                return;
            }

            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let randomWeight = Math.floor(Math.random() * totalWeight);
            let selectedPrize = prizes[0];

            for (let p of prizes) {
                if (randomWeight < p.weight) {
                    selectedPrize = p;
                    break;
                }
                randomWeight -= p.weight;
            }

            const codeIndex = db.codes.findIndex(c => c.id === currentCodeObj.id);
            if (codeIndex !== -1) {
                db.codes[codeIndex].status = "USED";
                db.codes[codeIndex].usedAt = Date.now();
            }

            if (!selectedPrize.unlimitedQuantity && selectedPrize.quantity > 0) {
                const prizeIndex = db.prizes.findIndex(p => p.id === selectedPrize.id);
                if (prizeIndex !== -1) {
                    db.prizes[prizeIndex].quantity -= 1;
                    if (db.prizes[prizeIndex].quantity === 0) {
                        db.prizes[prizeIndex].active = false;
                    }
                }
            }

            const newSpin = {
                id: Date.now(),
                campaignId: campaignId,
                accessCodeId: currentCodeObj.id,
                prizeId: selectedPrize.id,
                clientName: "",
                observation: "",
                prizeNameSnapshot: selectedPrize.name,
                discountSnapshot: selectedPrize.discount,
                createdAt: Date.now()
            };
            db.spins.unshift(newSpin);
            saveDB(db);

            const prizeIndex = prizes.findIndex(p => p.id === selectedPrize.id);
            const sliceAngleDeg = 360 / prizes.length;
            const targetSliceCenterAngle = prizeIndex * sliceAngleDeg + (sliceAngleDeg / 2);
            const desiredMod = (270 - targetSliceCenterAngle + 360) % 360;
            const currentMod = currentRotation % 360;
            let diff = desiredMod - currentMod;
            if (diff < 0) diff += 360;

            const targetAngle = currentRotation + (360 * 6) + diff;
            currentRotation = targetAngle;

            const canvas = document.getElementById("wheelCanvas");
            if (canvas) {
                canvas.style.transform = `rotate(${targetAngle}deg)`;
            }

            setTimeout(() => {
                isSpinning = false;
                lastWonPrize = selectedPrize;
                router();
            }, 5000);
        }

        // --- Admin Panel ---
        let adminTab = "campaigns";

        function renderAdmin(container, db) {
            container.innerHTML = `
                <div class="flex-1 flex flex-col bg-slate-900 text-white min-h-screen">
                    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
                        <h1 class="text-xl font-bold flex items-center gap-2">
                            <i class="fa-solid fa-gauge-high text-yellow-400"></i> Painel Administrativo
                        </h1>
                        <a href="#roleta/outubro" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-4 py-2 rounded-xl text-sm font-extrabold transition flex items-center gap-2 shadow-lg">
                            <i class="fa-solid fa-eye"></i> Ver Roleta Pública
                        </a>
                    </header>

                    <div class="bg-slate-900 border-b border-slate-800 flex overflow-x-auto px-4 gap-2">
                        <button onclick="setAdminTab('campaigns')" class="px-4 py-3 font-semibold text-sm border-b-2 ${adminTab === 'campaigns' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400'}">Campanhas</button>
                        <button onclick="setAdminTab('prizes')" class="px-4 py-3 font-semibold text-sm border-b-2 ${adminTab === 'prizes' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400'}">Prêmios & Frases</button>
                        <button onclick="setAdminTab('codes')" class="px-4 py-3 font-semibold text-sm border-b-2 ${adminTab === 'codes' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400'}">Códigos</button>
                        <button onclick="setAdminTab('results')" class="px-4 py-3 font-semibold text-sm border-b-2 ${adminTab === 'results' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400'}">Resultados</button>
                        <button onclick="setAdminTab('settings')" class="px-4 py-3 font-semibold text-sm border-b-2 ${adminTab === 'settings' ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400'}">Configurações</button>
                    </div>

                    <main class="flex-1 p-6 overflow-y-auto max-w-5xl w-full mx-auto" id="adminContent">
                        ${renderAdminTabContent(db)}
                    </main>
                </div>
            `;
        }

        function setAdminTab(tab) {
            adminTab = tab;
            router();
        }

        function renderAdminTabContent(db) {
            if (adminTab === 'campaigns') {
                return `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-bold">Campanhas</h2>
                            <button onclick="openNewCampaignModal()" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-4 py-2 rounded-xl font-bold text-sm">+ Nova Campanha</button>
                        </div>
                        <div class="grid gap-4">
                            ${db.campaigns.map(c => `
                                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex justify-between items-center">
                                    <div>
                                        <h3 class="font-bold text-lg">${c.name}</h3>
                                        <p class="text-sm text-yellow-400">Link: <a href="#roleta/${c.slug}" class="underline">/#roleta/${c.slug}</a></p>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <button onclick="editCampaign(${c.id})" class="text-blue-400 hover:text-blue-300 p-2"><i class="fa-solid fa-pen"></i></button>
                                        <span class="px-3 py-1 rounded-full text-xs font-bold ${c.active ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">${c.active ? 'Ativa' : 'Inativa'}</span>
                                        <button onclick="deleteCampaign(${c.id})" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (adminTab === 'prizes') {
                const activeCamp = db.campaigns[0];
                const prizes = db.prizes.filter(p => p.campaignId === activeCamp.id);
                const totalWeight = prizes.filter(p => p.active).reduce((sum, p) => sum + p.weight, 0);

                return `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-bold">Prêmios & Frases (${activeCamp.name})</h2>
                            <button onclick="openNewPrizeModal(${activeCamp.id})" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-4 py-2 rounded-xl font-bold text-sm">+ Adicionar Prêmio / Frase</button>
                        </div>
                        <div class="grid gap-4">
                            ${prizes.map(p => {
                                const prob = totalWeight > 0 && p.active ? ((p.weight / totalWeight) * 100).toFixed(1) : 0;
                                return `
                                    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex justify-between items-center">
                                        <div>
                                            <h3 class="font-bold text-lg">${p.name}</h3>
                                            <p class="text-sm text-slate-300">Texto na Roleta: <span class="font-semibold text-yellow-400">"${p.displayText}"</span> | Peso: ${p.weight} | Probabilidade: <span class="text-yellow-400 font-bold">${prob}%</span></p>
                                            <p class="text-xs text-slate-500">Estoque: ${p.unlimitedQuantity ? 'Ilimitado' : p.quantity}</p>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <button onclick="editPrize(${p.id})" class="text-blue-400 hover:text-blue-300 p-2" title="Editar Prêmio"><i class="fa-solid fa-pen"></i></button>
                                            <button onclick="togglePrize(${p.id})" class="px-3 py-1 rounded-full text-xs font-bold ${p.active ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-400'}">${p.active ? 'Ativo' : 'Inativo'}</button>
                                            <button onclick="deletePrize(${p.id})" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (adminTab === 'codes') {
                const activeCamp = db.campaigns[0];
                const codes = db.codes.filter(c => c.campaignId === activeCamp.id);

                return `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-bold">Códigos de Liberação</h2>
                            <div class="flex gap-2">
                                <button onclick="generateCodes(${activeCamp.id}, 50)" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-4 py-2 rounded-xl font-bold text-sm">+ Gerar 50 Códigos</button>
                                <button onclick="exportCodesCSV()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl font-bold text-sm"><i class="fa-solid fa-download"></i> CSV</button>
                            </div>
                        </div>
                        <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-900 text-slate-400 text-xs uppercase">
                                    <tr>
                                        <th class="p-4">Código</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">Utilizado em</th>
                                        <th class="p-4 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-700 text-sm">
                                    ${codes.map(c => `
                                        <tr>
                                            <td class="p-4 font-mono font-bold">${c.code}</td>
                                            <td class="p-4">
                                                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${c.status === 'AVAILABLE' ? 'bg-emerald-500/20 text-emerald-400' : c.status === 'USED' ? 'bg-blue-500/20 text-blue-400' : 'bg-slate-700 text-slate-400'}">${c.status}</span>
                                            </td>
                                            <td class="p-4 text-slate-400">${c.usedAt ? new Date(c.usedAt).toLocaleString() : '-'}</td>
                                            <td class="p-4 text-right">
                                                <button onclick="deleteCode(${c.id})" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if (adminTab === 'results') {
                return `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-bold">Resultados dos Giros</h2>
                            <button onclick="exportResultsCSV()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl font-bold text-sm"><i class="fa-solid fa-download"></i> CSV</button>
                        </div>
                        <div class="grid gap-4">
                            ${db.spins.map(s => `
                                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <h3 class="font-bold text-lg text-yellow-400">${s.prizeNameSnapshot} (${s.discountSnapshot})</h3>
                                            <p class="text-xs text-slate-400">${new Date(s.createdAt).toLocaleString()}</p>
                                        </div>
                                    </div>
                                    <div class="grid sm:grid-cols-2 gap-3">
                                        <input type="text" value="${s.clientName || ''}" onchange="updateSpinClient(${s.id}, 'clientName', this.value)" placeholder="Nome do Cliente" class="bg-slate-900 border border-slate-700 px-3 py-2 rounded-xl text-sm">
                                        <input type="text" value="${s.observation || ''}" onchange="updateSpinClient(${s.id}, 'observation', this.value)" placeholder="Observação" class="bg-slate-900 border border-slate-700 px-3 py-2 rounded-xl text-sm">
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (adminTab === 'settings') {
                const activeCamp = db.campaigns[0];
                const s = db.settings[activeCamp.id] || db.settings[1];

                return `
                    <div class="space-y-6 max-w-xl">
                        <h2 class="text-2xl font-bold">Configurações da Página</h2>
                        <div class="space-y-4 bg-slate-800 p-6 rounded-2xl border border-slate-700">
                            <div>
                                <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Título Principal</label>
                                <input type="text" id="st_title" value="${s.title}" class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl">
                            </div>
                            <div>
                                <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Subtítulo</label>
                                <input type="text" id="st_subtitle" value="${s.subtitle}" class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl">
                            </div>
                            <div>
                                <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Texto do Botão Girar</label>
                                <input type="text" id="st_spin_btn" value="${s.spin_button}" class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Cor de Fundo (HEX)</label>
                                    <input type="text" id="st_bg" value="${s.bg_color}" class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl">
                                </div>
                                <div>
                                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Cor do Botão (HEX)</label>
                                    <input type="text" id="st_btn" value="${s.btn_color}" class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl">
                                </div>
                            </div>
                            <button onclick="saveSettings(${activeCamp.id})" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 w-full py-3 rounded-xl font-bold">Salvar Configurações</button>
                        </div>
                    </div>
                `;
            }
        }

        function openNewCampaignModal() {
            const name = prompt("Nome da Campanha:");
            if (!name) return;
            const slug = prompt("Slug da URL (ex: promocao-1):", name.toLowerCase().replace(/[^a-z0-9]/g, "-"));
            if (!slug) return;

            const db = loadDB();
            const newId = Date.now();
            db.campaigns.push({ id: newId, name, slug, active: true });
            db.settings[newId] = { ...db.settings[1], title: name };
            saveDB(db);
            router();
        }

        function editCampaign(id) {
            const db = loadDB();
            const c = db.campaigns.find(x => x.id === id);
            if (!c) return;

            const name = prompt("Nome da Campanha:", c.name);
            if (name === null) return;
            const slug = prompt("Slug da URL:", c.slug);
            if (slug === null) return;

            c.name = name;
            c.slug = slug;
            saveDB(db);
            router();
        }

        function deleteCampaign(id) {
            const db = loadDB();
            db.campaigns = db.campaigns.filter(c => c.id !== id);
            saveDB(db);
            router();
        }

        function openNewPrizeModal(campaignId) {
            const name = prompt("Nome do Prêmio / Frase (ex: Frete Grátis / R$ 20):", "Frete Grátis");
            if (!name) return;
            const displayText = prompt("Texto exibido na Fatia da Roleta:", name);
            const resultText = prompt("Texto exibido no Resultado (Celebração):", name.toUpperCase());
            const weight = parseInt(prompt("Peso (probabilidade):", "15")) || 10;
            const quantity = parseInt(prompt("Quantidade em estoque:", "100")) || 100;

            const db = loadDB();
            db.prizes.push({
                id: Date.now(),
                campaignId,
                name,
                description: "Prêmio promocional exclusivo",
                displayText: displayText || name,
                resultText: resultText || name.toUpperCase(),
                discount: displayText || name,
                weight,
                quantity,
                unlimitedQuantity: false,
                active: true
            });
            saveDB(db);
            router();
        }

        function editPrize(id) {
            const db = loadDB();
            const p = db.prizes.find(x => x.id === id);
            if (!p) return;

            const name = prompt("Nome do Prêmio / Frase:", p.name);
            if (name === null) return;
            const displayText = prompt("Texto exibido na Fatia da Roleta:", p.displayText);
            if (displayText === null) return;
            const resultText = prompt("Texto exibido no Resultado (Celebração):", p.resultText);
            if (resultText === null) return;
            const weight = parseInt(prompt("Peso (probabilidade):", p.weight)) || p.weight;
            const quantity = parseInt(prompt("Quantidade em estoque:", p.quantity)) || p.quantity;

            p.name = name;
            p.displayText = displayText;
            p.resultText = resultText;
            p.weight = weight;
            p.quantity = quantity;
            p.discount = displayText;

            saveDB(db);
            router();
        }

        function togglePrize(id) {
            const db = loadDB();
            const p = db.prizes.find(x => x.id === id);
            if (p) p.active = !p.active;
            saveDB(db);
            router();
        }

        function deletePrize(id) {
            const db = loadDB();
            db.prizes = db.prizes.filter(p => p.id !== id);
            saveDB(db);
            router();
        }

        function generateCodes(campaignId, count) {
            const db = loadDB();
            const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            for (let i = 0; i < count; i++) {
                let code = "RLT-";
                for (let j = 0; j < 6; j++) {
                    code += charset.charAt(Math.floor(Math.random() * charset.length));
                }
                db.codes.push({
                    id: Date.now() + Math.random(),
                    campaignId,
                    code,
                    status: "AVAILABLE",
                    usedAt: null
                });
            }
            saveDB(db);
            router();
        }

        function deleteCode(id) {
            const db = loadDB();
            db.codes = db.codes.filter(c => c.id !== id);
            saveDB(db);
            router();
        }

        function updateSpinClient(id, field, value) {
            const db = loadDB();
            const spin = db.spins.find(s => s.id === id);
            if (spin) {
                spin[field] = value;
                saveDB(db);
            }
        }

        function saveSettings(campaignId) {
            const db = loadDB();
            if (!db.settings[campaignId]) db.settings[campaignId] = { ...db.settings[1] };
            db.settings[campaignId].title = document.getElementById("st_title").value;
            db.settings[campaignId].subtitle = document.getElementById("st_subtitle").value;
            db.settings[campaignId].spin_button = document.getElementById("st_spin_btn").value;
            db.settings[campaignId].bg_color = document.getElementById("st_bg").value;
            db.settings[campaignId].btn_color = document.getElementById("st_btn").value;
            saveDB(db);
            alert("Configurações salvas com sucesso!");
            router();
        }

        function exportCodesCSV() {
            const db = loadDB();
            let csv = "Codigo,Status,DataUtilizacao\n";
            db.codes.forEach(c => {
                csv += `${c.code},${c.status},${c.usedAt ? new Date(c.usedAt).toISOString() : ''}\n`;
            });
            downloadCSV(csv, "codigos_roleta.csv");
        }

        function exportResultsCSV() {
            const db = loadDB();
            let csv = "Codigo,Cliente,Premio,Valor,Data,Observacao\n";
            db.spins.forEach(s => {
                csv += `"${s.accessCodeId}","${s.clientName || ''}","${s.prizeNameSnapshot}","${s.discountSnapshot}","${new Date(s.createdAt).toISOString()}","${s.observation || ''}"\n`;
            });
            downloadCSV(csv, "resultados_giros.csv");
        }

        function downloadCSV(csv, filename) {
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', filename);
            a.style.visibility = 'hidden';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
