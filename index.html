<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta da Sorte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .gold-text {
            background: linear-gradient(180deg, #FFFDF0 0%, #FDE047 50%, #CA8A04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.8));
        }
        .gold-btn {
            background: linear-gradient(180deg, #FEF08A 0%, #FACC15 50%, #B45309 100%);
            box-shadow: 0 8px 30px rgba(250, 204, 21, 0.7), inset 0 2px 4px rgba(255,255,255,0.9), inset 0 -2px 4px rgba(120,53,15,0.9);
        }
        .casino-rim {
            background: radial-gradient(circle, #FEF08A 0%, #EAB308 50%, #78350F 100%);
            box-shadow: 0 0 70px rgba(234, 179, 8, 0.8), inset 0 0 25px rgba(255,255,255,0.8);
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }
        .casino-bulb {
            animation: pulse-glow 1s infinite alternate;
        }
    </style>
</head>
<body class="bg-[#060913] text-white min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col relative z-10">
        <!-- Rendered dynamically by JS -->
    </div>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform transition-all duration-300 translate-y-24 opacity-0 pointer-events-none bg-slate-900 border border-yellow-500/50 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMsg">Mensagem</span>
    </div>

    <script>
        // --- Supabase Cloud Connection ---
        const SUPABASE_URL = "https://glcsnkebmjtuqeciihzu.supabase.co";
        const SUPABASE_KEY = "sb_publishable_hxcloNo4rrkNUvtJ4ogk7A_FGaGTSfT";

        let supabaseStatus = "connected"; // "connected", "syncing", "error"
        let supabaseErrorMessage = "";
        let isSaving = false;

        // --- Database & LocalStorage State Management ---
        const DB_KEY = "roleta_db_v1";

        function getInitialData() {
            return {
                campaigns: [
                    { id: 1, name: "Outubro Premiado", slug: "outubro", active: true }
                ],
                prizes: [
                    { id: 1, campaignId: 1, name: "5% de Desconto", description: "Desconto exclusivo de 5%", displayText: "5%", resultText: "5% DE DESCONTO", discount: "5%", weight: 35, quantity: 500, unlimitedQuantity: false, active: true },
                    { id: 2, campaignId: 1, name: "10% de Desconto", description: "Desconto especial de 10%", displayText: "10%", resultText: "10% DE DESCONTO", discount: "10%", weight: 30, quantity: 300, unlimitedQuantity: false, active: true },
                    { id: 3, campaignId: 1, name: "15% de Desconto", description: "Desconto exclusivo de 15%", displayText: "15%", resultText: "15% DE DESCONTO", discount: "15%", weight: 20, quantity: 150, unlimitedQuantity: false, active: true },
                    { id: 4, campaignId: 1, name: "20% de Desconto", description: "Super desconto de 20%", displayText: "20%", resultText: "20% DE DESCONTO", discount: "20%", weight: 12, quantity: 80, unlimitedQuantity: false, active: true },
                    { id: 5, campaignId: 1, name: "50% de Desconto", description: "Prêmio máximo da roleta!", displayText: "50%", resultText: "50% DE DESCONTO", discount: "50%", weight: 3, quantity: 10, unlimitedQuantity: false, active: true }
                ],
                codes: [
                    { id: 1, campaignId: 1, code: "RLT-7X92KP", status: "AVAILABLE", usedAt: null },
                    { id: 2, campaignId: 1, code: "RLT-4M8Q2A", status: "AVAILABLE", usedAt: null },
                    { id: 3, campaignId: 1, code: "RLT-9ZK31B", status: "AVAILABLE", usedAt: null },
                    { id: 4, campaignId: 1, code: "RLT-2P7X8M", status: "AVAILABLE", usedAt: null },
                    { id: 5, campaignId: 1, code: "RLT-TEST01", status: "AVAILABLE", usedAt: null },
                    { id: 6, campaignId: 1, code: "RLT-SORTE", status: "AVAILABLE", usedAt: null },
                    { id: 7, campaignId: 1, code: "RLT-VIP10", status: "AVAILABLE", usedAt: null },
                    { id: 8, campaignId: 1, code: "RLT-CLIENTE", status: "AVAILABLE", usedAt: null }
                ],
                spins: [],
                settings: {
                    1: {
                        title: "ROLETA DA SORTE",
                        subtitle: "Gire a roleta e ganhe descontos e benefícios incríveis!",
                        code_placeholder: "Digite seu código (ex: RLT-7X92KP)",
                        liberate_button: "LIBERAR ROLETA",
                        valid_code_msg: "Código validado com sucesso!",
                        spin_button: "CLIQUE AQUI E GIRE A ROLETA",
                        spinning_msg: "Girando roleta...",
                        result_title: "🎉 PARABÉNS! 🎉",
                        result_prize_prefix: "VOCÊ GANHOU",
                        result_success_msg: "Seu prêmio foi registrado com sucesso no sistema.",
                        bg_color: "#060913",
                        text_color: "#FFFFFF",
                        btn_color: "#FACC15",
                        btn_text_color: "#1E1B4B"
                    }
                }
            };
        }

        function loadDB() {
            const data = localStorage.getItem(DB_KEY);
            if (!data) {
                const initial = getInitialData();
                localStorage.setItem(DB_KEY, JSON.stringify(initial));
                return initial;
            }
            try {
                const parsed = JSON.parse(data);
                if (!parsed.campaigns || !parsed.prizes) {
                    const initial = getInitialData();
                    localStorage.setItem(DB_KEY, JSON.stringify(initial));
                    return initial;
                }
                return parsed;
            } catch (e) {
                const initial = getInitialData();
                localStorage.setItem(DB_KEY, JSON.stringify(initial));
                return initial;
            }
        }

        async function fetchFromSupabase(silent = false) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/user_favorites?song_id=eq.roleta_config`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }

                const list = await res.json();
                if (list && list.length > 0 && list[0].video_data) {
                    const cloudData = list[0].video_data;
                    if (cloudData.campaigns && Array.isArray(cloudData.campaigns)) {
                        localStorage.setItem(DB_KEY, JSON.stringify(cloudData));
                        supabaseStatus = "connected";
                        supabaseErrorMessage = "";
                        updateSupabaseUI();
                        router();
                        if (!silent) showToast("Sincronizado com Supabase com sucesso!", "success");
                        return;
                    }
                }

                // If no row exists yet, seed it with current local db
                const current = loadDB();
                await saveToSupabase(current, false);
                supabaseStatus = "connected";
                updateSupabaseUI();
            } catch (e) {
                console.warn("Supabase fetch warning:", e);
                supabaseStatus = "error";
                supabaseErrorMessage = e.message || "Erro de conexão";
                updateSupabaseUI();
            }
        }

        async function saveToSupabase(db, notify = true) {
            isSaving = true;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/user_favorites?song_id=eq.roleta_config`, {
                    method: "PATCH",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify({
                        video_data: db,
                        updated_at: new Date().toISOString()
                    })
                });

                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }

                supabaseStatus = "connected";
                supabaseErrorMessage = "";
                updateSupabaseUI();
                if (notify) showToast("Salvo e sincronizado no Supabase em tempo real!", "success");
            } catch (e) {
                console.error("Supabase save error:", e);
                supabaseStatus = "error";
                supabaseErrorMessage = e.message || "Erro ao salvar no Supabase";
                updateSupabaseUI();
                if (notify) showToast("Salvo localmente! Verifique a conexão com o Supabase.", "warning");
            } finally {
                isSaving = false;
            }
        }

        function saveDB(db, notify = true) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            saveToSupabase(db, notify);
        }

        // Auto-fetch on initial page load
        fetchFromSupabase(true);

        // Auto-sync when user returns to tab
        window.addEventListener("focus", () => fetchFromSupabase(true));

        // Periodic background sync every 15 seconds
        setInterval(() => {
            if (!isSpinning && !isSaving) {
                fetchFromSupabase(true);
            }
        }, 15000);

        function showToast(msg, type = "success") {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMsg");
            const toastIcon = document.getElementById("toastIcon");
            if (!toast) return;

            toastMsg.innerText = msg;
            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            } else if (type === "warning") {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400 text-lg";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-red-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-info-circle text-blue-400 text-lg";
            }

            toast.classList.remove("translate-y-24", "opacity-0", "pointer-events-none");
            toast.classList.add("translate-y-0", "opacity-100");

            setTimeout(() => {
                toast.classList.add("translate-y-24", "opacity-0", "pointer-events-none");
                toast.classList.remove("translate-y-0", "opacity-100");
            }, 3500);
        }

        // --- Router & App State ---
        let currentCodeObj = null;
        let isSpinning = false;
        let lastWonPrize = null;
        let currentRotation = 0;

        function router() {
            try {
                const hash = window.location.hash;
                const app = document.getElementById("app");
                const db = loadDB();

                if (hash.includes("admin")) {
                    renderAdmin(app, db);
                } else {
                    let slug = "outubro";
                    if (hash.startsWith("#roleta/")) {
                        slug = hash.replace("#roleta/", "");
                    }
                    const campaign = (db.campaigns || []).find(c => c.slug === slug) || (db.campaigns || [])[0];
                    renderPublicRoleta(app, db, campaign);
                }
            } catch (e) {
                console.error("Router error:", e);
                document.getElementById("app").innerHTML = `<div class="p-8 text-red-500 font-bold">Erro ao carregar tela: ${e.message}</div>`;
            }
        }

        window.addEventListener("hashchange", router);
        window.addEventListener("load", router);

        // --- Public Roleta Screen (Zero admin buttons) ---
        function renderPublicRoleta(container, db, campaign) {
            if (!campaign || campaign.active === false) {
                container.innerHTML = `
                    <div class="flex-1 flex items-center justify-center p-6 text-center">
                        <div class="bg-slate-900 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-800">
                            <h1 class="text-2xl font-bold text-red-500 mb-2">Campanha Indisponível</h1>
                            <p class="text-slate-400">Esta campanha de prêmios está encerrada ou não existe.</p>
                        </div>
                    </div>
                `;
                return;
            }

            const settings = (db.settings || {})[campaign.id] || (db.settings || {})[1] || (db.settings || {})[Object.keys(db.settings || {})[0]] || {};
            
            // Filter prizes for this campaign, with safe fallback
            let prizes = (db.prizes || []).filter(p => String(p.campaignId) === String(campaign.id) && p.active !== false && (p.unlimitedQuantity || p.quantity === undefined || p.quantity > 0));
            if (prizes.length === 0 && (db.prizes || []).length > 0) {
                prizes = (db.prizes || []).filter(p => p.active !== false && (p.unlimitedQuantity || p.quantity === undefined || p.quantity > 0));
            }
            if (prizes.length === 0) {
                prizes = (db.prizes || []);
            }

            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-4 relative" style="background-color: ${settings.bg_color || '#060913'}; color: ${settings.text_color || '#FFFFFF'};">
                    <div class="max-w-md w-full text-center px-4 py-6 flex flex-col items-center">
                        
                        <!-- Header Title matching reference image -->
                        <div class="mb-4 text-center">
                            <h2 class="text-xs font-extrabold tracking-[0.4em] text-white uppercase opacity-90">ROLETA DA</h2>
                            <h1 class="text-4xl sm:text-5xl font-black tracking-wider gold-text uppercase flex items-center justify-center gap-2">
                                SORTE <i class="fa-solid fa-clover text-yellow-400 text-3xl"></i>
                            </h1>
                            <p class="text-xs sm:text-sm font-semibold text-yellow-100/90 mt-2 max-w-xs mx-auto">${settings.subtitle || ''}</p>
                        </div>

                        <!-- Wheel Container with Casino Glowing Rim & Bulbs -->
                        <div class="relative w-80 h-80 sm:w-88 sm:h-88 mx-auto mb-6 flex items-center justify-center">
                            <!-- Outer Casino Rim with Bulbs -->
                            <div class="absolute inset-0 rounded-full casino-rim p-5 flex items-center justify-center shadow-[0_0_80px_rgba(234,179,8,0.8)]">
                                <!-- Glowing Light Bulbs Around Rim -->
                                <div class="absolute inset-2 rounded-full border-2 border-dashed border-yellow-100/60 pointer-events-none"></div>
                                <div class="absolute top-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]"></div>
                                <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]" style="animation-delay: 0.3s;"></div>
                                <div class="absolute left-1 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]" style="animation-delay: 0.6s;"></div>
                                <div class="absolute right-1 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full casino-bulb shadow-[0_0_8px_#FFF]" style="animation-delay: 0.9s;"></div>
                                <div class="absolute top-6 left-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.2s;"></div>
                                <div class="absolute top-6 right-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.5s;"></div>
                                <div class="absolute bottom-6 left-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.7s;"></div>
                                <div class="absolute bottom-6 right-6 w-2.5 h-2.5 bg-white rounded-full casino-bulb shadow-[0_0_6px_#FFF]" style="animation-delay: 0.4s;"></div>

                                <!-- Inner Wheel Background -->
                                <div class="w-full h-full rounded-full bg-slate-950 relative flex items-center justify-center overflow-hidden border-2 border-yellow-400 shadow-inner">
                                    <canvas id="wheelCanvas" width="320" height="320" class="w-full h-full rounded-full transition-transform duration-[5000ms] cubic-bezier(0.15, 0, 0.15, 1)"></canvas>
                                </div>
                            </div>

                            <!-- Center Gold Cap with Star -->
                            <div class="absolute w-16 h-16 rounded-full bg-gradient-to-tr from-yellow-700 via-yellow-400 to-yellow-200 shadow-2xl flex items-center justify-center border-4 border-yellow-100 z-20">
                                <div class="w-10 h-10 rounded-full bg-slate-950 flex items-center justify-center shadow-inner">
                                    <i class="fa-solid fa-star text-yellow-400 text-xl"></i>
                                </div>
                            </div>

                            <!-- Top Casino Pointer -->
                            <div class="absolute -top-3 w-10 h-11 bg-gradient-to-b from-red-500 via-red-600 to-red-900 shadow-[0_5px_15px_rgba(0,0,0,0.8)] rounded-b-xl flex items-center justify-center border-2 border-yellow-300 z-30">
                                <div class="w-4 h-4 bg-yellow-300 rounded-full shadow-[0_0_10px_#FDE047] mb-2"></div>
                            </div>
                        </div>

                        <!-- Interaction Area -->
                        <div id="interactionArea" class="w-full">
                            ${!currentCodeObj ? `
                                <div class="space-y-4 bg-slate-900/95 backdrop-blur-md p-6 rounded-3xl border border-yellow-500/40 shadow-2xl">
                                    <input type="text" id="codeInput" placeholder="${settings.code_placeholder || 'Digite seu código'}" class="w-full px-4 py-3.5 rounded-2xl bg-slate-950 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-yellow-400 text-center font-bold tracking-wider uppercase text-sm shadow-inner">
                                    <button onclick="validateCode(${campaign.id})" class="w-full py-4 rounded-2xl font-black text-base gold-btn text-indigo-950 hover:scale-[1.02] active:scale-[0.98] transition uppercase tracking-wider shadow-lg">
                                        ${settings.liberate_button || 'LIBERAR ROLETA'}
                                    </button>
                                    <div id="codeError" class="text-red-400 text-xs font-semibold"></div>
                                </div>
                            ` : !lastWonPrize ? `
                                <div class="space-y-3">
                                    <p class="text-emerald-400 font-bold text-sm bg-emerald-950/60 py-2.5 px-4 rounded-xl border border-emerald-500/40 shadow-md">${settings.valid_code_msg || 'Código validado!'}</p>
                                    <button onclick="spinWheel(${campaign.id})" id="spinBtn" class="w-full py-5 rounded-2xl font-black text-lg sm:text-xl gold-btn text-indigo-950 shadow-[0_8px_35px_rgba(250,204,21,0.8)] hover:scale-[1.02] active:scale-[0.98] transition uppercase tracking-wider flex items-center justify-center gap-3">
                                        <span>${settings.spin_button || 'CLIQUE AQUI E GIRE A ROLETA'}</span>
                                        <i class="fa-solid fa-hand-pointer text-xl animate-bounce"></i>
                                    </button>
                                </div>
                            ` : `
                                <div class="bg-slate-900/95 border border-yellow-500/60 p-6 rounded-3xl shadow-2xl space-y-3 backdrop-blur-md">
                                    <h2 class="text-2xl font-black text-yellow-400">${settings.result_title || 'PARABÉNS!'}</h2>
                                    <p class="text-xs uppercase tracking-widest text-slate-400">${settings.result_prize_prefix || 'VOCÊ GANHOU'}</p>
                                    <div class="text-3xl font-black text-white drop-shadow-[0_2px_8px_rgba(251,191,36,0.7)]">${lastWonPrize.resultText || lastWonPrize.name}</div>
                                    <p class="text-sm text-slate-300">${lastWonPrize.description}</p>
                                    <p class="text-xs text-yellow-400/80 mt-2 font-medium">${settings.result_success_msg || ''}</p>
                                    <button onclick="resetAndReload()" class="mt-4 px-6 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-yellow-400 font-bold text-xs uppercase tracking-wider transition shadow-md">Girar Novamente</button>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;

            drawWheel(prizes, currentRotation);
            requestAnimationFrame(() => drawWheel(prizes, currentRotation));
        }

        function resetAndReload() {
            currentCodeObj = null;
            lastWonPrize = null;
            isSpinning = false;
            router();
        }

        function drawWheel(prizes, rotationAngle) {
            const canvas = document.getElementById("wheelCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const width = canvas.width;
            const height = canvas.height;
            const center = width / 2;
            const radius = center - 6;

            ctx.clearRect(0, 0, width, height);

            if (!prizes || prizes.length === 0) return;

            const sliceAngle = (2 * Math.PI) / prizes.length;
            const colors = ["#7C3AED", "#2563EB", "#059669", "#DB2777", "#EA580C"];

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(rotationAngle * Math.PI / 180);
            ctx.translate(-center, -center);

            prizes.forEach((prize, i) => {
                const startAngle = i * sliceAngle;
                const endAngle = (i + 1) * sliceAngle;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = "#FDE047";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#FFFFFF";
                ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
                ctx.shadowBlur = 8;
                ctx.font = "bold 14px sans-serif";
                ctx.fillText(prize.displayText || prize.discount || prize.name, radius - 20, 5);
                ctx.restore();
            });

            ctx.restore();
        }

        function validateCode(campaignId) {
            const input = document.getElementById("codeInput").value.trim().toUpperCase();
            const db = loadDB();
            const errDiv = document.getElementById("codeError");

            if (!input) {
                errDiv.innerText = "Por favor, digite um código.";
                return;
            }

            const codeObj = (db.codes || []).find(c => String(c.campaignId) === String(campaignId) && c.code === input);
            if (!codeObj) {
                errDiv.innerText = "Código inválido.";
                return;
            }

            if (codeObj.status === "USED") {
                errDiv.innerText = "Este código já foi utilizado.";
                return;
            }

            if (codeObj.status === "INACTIVE") {
                errDiv.innerText = "Este código está inativo.";
                return;
            }

            currentCodeObj = codeObj;
            errDiv.innerText = "";
            router();
        }

        function spinWheel(campaignId) {
            if (isSpinning || !currentCodeObj) return;
            isSpinning = true;

            const db = loadDB();
            let prizes = (db.prizes || []).filter(p => String(p.campaignId) === String(campaignId) && p.active !== false && (p.unlimitedQuantity || p.quantity === undefined || p.quantity > 0));
            if (prizes.length === 0 && (db.prizes || []).length > 0) {
                prizes = (db.prizes || []).filter(p => p.active !== false && (p.unlimitedQuantity || p.quantity === undefined || p.quantity > 0));
            }

            if (prizes.length === 0) {
                alert("Nenhum prêmio disponível no momento.");
                isSpinning = false;
                return;
            }

            const totalWeight = prizes.reduce((sum, p) => sum + (p.weight || 10), 0);
            let randomWeight = Math.floor(Math.random() * totalWeight);
            let selectedPrize = prizes[0];

            for (let p of prizes) {
                const w = p.weight || 10;
                if (randomWeight < w) {
                    selectedPrize = p;
                    break;
                }
                randomWeight -= w;
            }

            // Mark code as used
            const codeIndex = db.codes.findIndex(c => c.id === currentCodeObj.id);
            if (codeIndex !== -1) {
                db.codes[codeIndex].status = "USED";
                db.codes[codeIndex].usedAt = Date.now();
            }

            // Decrease quantity
            if (!selectedPrize.unlimitedQuantity && selectedPrize.quantity !== undefined && selectedPrize.quantity > 0) {
                const prizeIndex = db.prizes.findIndex(p => p.id === selectedPrize.id);
                if (prizeIndex !== -1) {
                    db.prizes[prizeIndex].quantity -= 1;
                    if (db.prizes[prizeIndex].quantity === 0) {
                        db.prizes[prizeIndex].active = false;
                    }
                }
            }

            // Record spin
            const newSpin = {
                id: Date.now(),
                campaignId: campaignId,
                accessCodeId: currentCodeObj.code,
                prizeId: selectedPrize.id,
                clientName: "",
                observation: "",
                prizeNameSnapshot: selectedPrize.name,
                discountSnapshot: selectedPrize.discount || selectedPrize.displayText,
                createdAt: Date.now()
            };
            if (!db.spins) db.spins = [];
            db.spins.unshift(newSpin);
            saveDB(db, false);

            // Calculate precise stop angle
            const prizeIndex = prizes.findIndex(p => p.id === selectedPrize.id);
            const sliceAngleDeg = 360 / prizes.length;
            const targetSliceCenterAngle = prizeIndex * sliceAngleDeg + (sliceAngleDeg / 2);
            const desiredMod = (270 - targetSliceCenterAngle + 360) % 360;
            const currentMod = currentRotation % 360;
            let diff = desiredMod - currentMod;
            if (diff < 0) diff += 360;

            const targetAngle = currentRotation + (360 * 6) + diff;
            currentRotation = targetAngle;

            const canvas = document.getElementById("wheelCanvas");
            if (canvas) {
                canvas.style.transform = `rotate(${targetAngle}deg)`;
            }

            setTimeout(() => {
                isSpinning = false;
                lastWonPrize = selectedPrize;
                router();
            }, 5000);
        }

        function savePrizeFromModal(prizeId, campaignId) {
            const name = document.getElementById("m_prize_name").value.trim();
            if (!name) {
                alert("Por favor, preencha o nome do prêmio.");
                return;
            }
            const displayText = document.getElementById("m_prize_display").value.trim() || name;
            const resultText = document.getElementById("m_prize_result").value.trim() || name.toUpperCase();
            const weight = parseInt(document.getElementById("m_prize_weight").value) || 10;
            const quantity = parseInt(document.getElementById("m_prize_quantity").value) || 100;
            const unlimitedQuantity = document.getElementById("m_prize_unlimited").checked;

            const db = loadDB();
            if (!db.prizes) db.prizes = [];

            if (prizeId) {
                const p = db.prizes.find(x => x.id == prizeId);
                if (p) {
                    p.name = name;
                    p.displayText = displayText;
                    p.resultText = resultText;
                    p.discount = displayText;
                    p.weight = weight;
                    p.quantity = quantity;
                    p.unlimitedQuantity = unlimitedQuantity;
                    p.active = true;
                }
            } else {
                db.prizes.push({
                    id: Date.now(),
                    campaignId: campaignId || 1,
                    name: name,
                    description: "Prêmio promocional exclusivo",
                    displayText: displayText,
                    resultText: resultText,
                    discount: displayText,
                    weight: weight,
                    quantity: quantity,
                    unlimitedQuantity: unlimitedQuantity,
                    active: true
                });
            }

            saveDB(db);
            closeModal();
            router();
        }

        }

        function generateCodes(campaignId, count) {
            const db = loadDB();
            const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            if (!db.codes) db.codes = [];
            for (let i = 0; i < count; i++) {
                let code = "RLT-";
                for (let j = 0; j < 6; j++) {
                    code += charset.charAt(Math.floor(Math.random() * charset.length));
                }
                db.codes.push({
                    id: Date.now() + Math.random(),
                    campaignId: campaignId,
                    code: code,
                    status: "AVAILABLE",
                    usedAt: null
                });
            }
            saveDB(db);
            showToast(`${count} novos códigos gerados com sucesso!`, "success");
            router();
        }

        function deleteCode(id) {
            const db = loadDB();
            db.codes = (db.codes || []).filter(c => c.id != id);
            saveDB(db);
            router();
        }

        function updateSpinClient(id, field, value) {
            const db = loadDB();
            const spin = (db.spins || []).find(s => s.id == id);
            if (spin) {
                spin[field] = value;
                saveDB(db, false);
            }
        }

        function saveSettings(campaignId) {
            const db = loadDB();
            if (!db.settings) db.settings = {};
            if (!db.settings[campaignId]) db.settings[campaignId] = { ...db.settings[1] };
            
            db.settings[campaignId].title = document.getElementById("st_title").value;
            db.settings[campaignId].subtitle = document.getElementById("st_subtitle").value;
            db.settings[campaignId].spin_button = document.getElementById("st_spin_btn").value;
            db.settings[campaignId].liberate_button = document.getElementById("st_lib_btn").value;
            db.settings[campaignId].bg_color = document.getElementById("st_bg").value;
            db.settings[campaignId].btn_color = document.getElementById("st_btn").value;
            
            saveDB(db);
            router();
        }

        function exportCodesCSV() {
            const db = loadDB();
            let csv = "Codigo,Status,DataUtilizacao\n";
            (db.codes || []).forEach(c => {
                csv += `${c.code},${c.status},${c.usedAt ? new Date(c.usedAt).toISOString() : ''}\n`;
            });
            downloadCSV(csv, "codigos_roleta.csv");
        }

        function exportResultsCSV() {
            const db = loadDB();
            let csv = "Codigo,Cliente,Premio,Valor,Data,Observacao\n";
            (db.spins || []).forEach(s => {
                csv += `"${s.accessCodeId}","${s.clientName || ''}","${s.prizeNameSnapshot}","${s.discountSnapshot}","${new Date(s.createdAt).toISOString()}","${s.observation || ''}"\n`;
            });
            downloadCSV(csv, "resultados_giros.csv");
        }

        function downloadCSV(csv, filename) {
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', filename);
            a.style.visibility = 'hidden';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
